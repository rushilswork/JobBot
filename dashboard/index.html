function AISearch({onResults,onClear,active}){
  const [q,setQ]=useState('');
  const [loading,setLoading]=useState(false);
  const [showRecents,setShowRecents]=useState(false);
  const [recents,setRecents]=useState(()=>{try{return JSON.parse(localStorage.getItem('jb-ai-recents')||'[]');}catch{return [];}});
  const recentsRef=useRef(null);
  const examples=['remote python backend, not fintech','full stack react node.js in Bengaluru','SDE at product company, 0-3 years','AI/ML engineer, startup, remote'];

  const saveRecent=qry=>{
    const next=[qry,...recents.filter(r=>r!==qry)].slice(0,5);
    setRecents(next);localStorage.setItem('jb-ai-recents',JSON.stringify(next));
  };
  const removeRecent=(qry,e)=>{
    e.stopPropagation();
    const next=recents.filter(r=>r!==qry);
    setRecents(next);localStorage.setItem('jb-ai-recents',JSON.stringify(next));
  };
  const clearAllRecents=()=>{setRecents([]);localStorage.removeItem('jb-ai-recents');};

  const search=async(query)=>{
    const qry=(query||q).trim();
    if(!qry)return;
    setShowRecents(false);
    saveRecent(qry);
    setLoading(true);
    try{
      const r=await fetch('/api/search/ai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query:qry,top_n:100})});
      const d=await r.json();
      if(r.ok)onResults(d.results,qry,d.total);
      else toast('Search failed: '+(d.detail||'unknown error'));
    }catch(e){toast('Search error');}
    setLoading(false);
  };

  const clearSearch=()=>{setQ('');if(active)onClear();};

  return(
    <div style={{position:'relative'}}>
      <div className="ai-search-bar">
        <div className="ai-input-wrap" style={{position:'relative',flex:1}}>
          <span className="ai-ico">✦</span>
          <input className="ai-input" value={q} onChange={e=>setQ(e.target.value)}
            onKeyDown={e=>e.key==='Enter'&&search()}
            onFocus={()=>setShowRecents(true)}
            onBlur={()=>setTimeout(()=>setShowRecents(false),160)}
            placeholder="Ask in plain English: remote python backend, not fintech…"
            style={{paddingRight:(active||q.trim())?'2rem':'1rem'}}/>
          {(active||q.trim())&&(
            <button onClick={clearSearch} title="Clear" style={{position:'absolute',right:'.55rem',top:'50%',transform:'translateY(-50%)',background:'none',border:'none',cursor:'pointer',color:'var(--txt3)',fontSize:'.85rem',padding:'2px 5px',lineHeight:1,borderRadius:4}}>✕</button>
          )}
        </div>
        <button className="ai-btn" onClick={()=>search()} disabled={loading||!q.trim()}>
          {loading?'Searching…':'Search'}
        </button>
      </div>
      {showRecents&&recents.length>0&&(
        <div ref={recentsRef} style={{position:'absolute',top:'calc(100% + 4px)',left:0,right:0,background:'var(--bg2)',border:'1px solid var(--bdr2)',borderRadius:10,zIndex:400,overflow:'hidden',boxShadow:'0 8px 28px rgba(0,0,0,.35)'}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'.45rem .8rem .3rem',borderBottom:'1px solid var(--bdr)'}}>
            <span style={{fontSize:'.63rem',fontWeight:700,letterSpacing:'.7px',textTransform:'uppercase',color:'var(--txt3)'}}>Recent searches</span>
            <button onClick={clearAllRecents} style={{background:'none',border:'none',cursor:'pointer',fontSize:'.68rem',color:'var(--txt3)',padding:'2px 4px'}}>Clear all</button>
          </div>
          {recents.map(r=>(
            <div key={r} onClick={()=>{setQ(r);search(r);}} style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'.45rem .8rem',cursor:'pointer',fontSize:'.8rem',color:'var(--txt2)',gap:8}}
              onMouseEnter={e=>e.currentTarget.style.background='var(--surf)'}
              onMouseLeave={e=>e.currentTarget.style.background=''}>
              <span style={{display:'flex',alignItems:'center',gap:7,minWidth:0,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>
                <span style={{color:'var(--txt3)',fontSize:'.72rem'}}>↩</span>{r}
              </span>
              <button onClick={e=>removeRecent(r,e)} style={{background:'none',border:'none',cursor:'pointer',color:'var(--txt3)',fontSize:'.72rem',padding:'2px 6px',flexShrink:0}}>✕</button>
            </div>
          ))}
        </div>
      )}
      {!active&&q===''&&(
        <div style={{padding:'.4rem 1.5rem .8rem',display:'flex',gap:6,flexWrap:'wrap'}}>
          {examples.map(ex=>(
            <span key={ex} onClick={()=>{setQ(ex);search(ex);}} style={{fontSize:'.68rem',color:'var(--txt3)',background:'var(--surf)',border:'1px solid var(--bdr)',borderRadius:20,padding:'3px 10px',cursor:'pointer',transition:'color .12s,border-color .12s'}}
              onMouseEnter={e=>{e.target.style.color='var(--accent)';e.target.style.borderColor='var(--accent)'}}
              onMouseLeave={e=>{e.target.style.color='';e.target.style.borderColor=''}}
            >{ex}</span>
          ))}
        </div>
      )}
    </div>
  );
}


function GoTop(){
  const [show,setShow]=useState(false);
  useEffect(()=>{
    const h=()=>setShow(window.scrollY>300);
    window.addEventListener('scroll',h,{passive:true});
    return()=>window.removeEventListener('scroll',h);
  },[]);
  return <button className={'go-top'+(show?'':' hidden')} onClick={()=>window.scrollTo({top:0,behavior:'smooth'})} title="Back to top">↑</button>;
}


function ApplyModal({job, onClose, onApplied}){
  const [status,setStatus]=useState('starting');
  const [data,setData]=useState(null);
  const [polling,setPolling]=useState(true);

  useEffect(()=>{
    // Start autofill
    fetch('/api/jobs/'+job.id+'/apply',{method:'POST'})
      .then(r=>r.json()).then(d=>{if(!d.ok)setStatus('error');})
      .catch(()=>setStatus('error'));
    // Poll for status
    const iv=setInterval(async()=>{
      try{
        const r=await fetch('/api/jobs/'+job.id+'/apply/status');
        const d=await r.json();
        setData(d);
        if(d.status==='waiting_confirm'){setStatus('ready');clearInterval(iv);setPolling(false);}
        else if(d.status==='submitted'){setStatus('submitted');clearInterval(iv);setPolling(false);onApplied&&onApplied(job);}
        else if(d.status==='error'||d.status==='cancelled'){setStatus(d.status);clearInterval(iv);setPolling(false);}
      }catch(e){}
    },2000);
    return()=>clearInterval(iv);
  },[]);

  const confirm=async()=>{
    setStatus('submitting');
    await fetch('/api/jobs/'+job.id+'/apply/confirm',{method:'POST'});
    // Resume polling to get final submitted/error status
    const iv2=setInterval(async()=>{
      try{const r=await fetch('/api/jobs/'+job.id+'/apply/status');const d=await r.json();
        if(d.status==='submitted'){setStatus('submitted');clearInterval(iv2);onApplied&&onApplied(job);}
        else if(['submit_error','error'].includes(d.status)){setStatus('error');setData(d);clearInterval(iv2);}
      }catch(e){}
    },1500);
    setTimeout(()=>clearInterval(iv2),30000);
  };
  const cancel=async()=>{
    await fetch('/api/jobs/'+job.id+'/apply/cancel',{method:'POST'});
    onClose();
  };

  return(
    <div className="apply-modal" onClick={e=>e.target===e.currentTarget&&cancel()}>
      <div className="apply-card">
        <div className="apply-hdr">
          <div className="apply-title">Auto-Apply — {job.company}</div>
          <button className="btn btn-ghost" onClick={cancel} style={{padding:'4px 10px'}}>✕</button>
        </div>
        <div style={{fontSize:'.8rem',color:'var(--txt2)',marginBottom:'.5rem'}}>{job.title}</div>

        {(status==='starting'||status==='filling')&&(
          <div className="apply-status">
            <div className="apply-spinner"/>
            <div>Filling your application...</div>
            <div style={{fontSize:'.72rem',color:'var(--txt3)',marginTop:'.3rem'}}>A browser window has opened</div>
          </div>
        )}

        {status==='ready'&&data&&(
          <>
            <div style={{fontSize:'.75rem',color:'var(--txt3)',marginBottom:'.5rem'}}>Review the filled form before submitting:</div>
            {data.screenshot_url&&<img src={data.screenshot_url} className="apply-screenshot" alt="Filled form"/>}
            {data.filled?.length>0&&(
              <div style={{marginBottom:'.5rem'}}>
                <div style={{fontSize:'.65rem',fontWeight:700,letterSpacing:'1px',textTransform:'uppercase',color:'var(--txt3)',marginBottom:4}}>Auto-filled ({data.filled.length})</div>
                <div className="apply-fields">{data.filled.map(f=><span key={f} className="apply-field">✓ {f}</span>)}</div>
              </div>
            )}
            {data.needs_manual?.length>0&&(
              <div style={{marginBottom:'.5rem'}}>
                <div style={{fontSize:'.65rem',fontWeight:700,letterSpacing:'1px',textTransform:'uppercase',color:'var(--txt3)',marginBottom:4}}>Needs your input ({data.needs_manual.length})</div>
                <div className="apply-fields">{data.needs_manual.map(f=><span key={f} className="apply-manual">⚠ {f}</span>)}</div>
              </div>
            )}
            <div className="apply-btns">
              <button className="btn-cancel-apply" onClick={cancel}>Cancel</button>
              <button className="btn-submit" onClick={confirm}>Submit Application →</button>
            </div>
          </>
        )}

        {status==='submitting'&&<div className="apply-status"><div className="apply-spinner"/><div>Submitting...</div></div>}
        {status==='submitted'&&<div className="apply-status" style={{color:'#16a34a'}}>✓ Application submitted!</div>}
        {status==='error'&&<div className="apply-status" style={{color:'var(--red)'}}>Error starting autofill. Make sure your profile.yaml is filled in.</div>}
        {status==='cancelled'&&<div className="apply-status">Cancelled.</div>}
      </div>
    </div>
  );
}

function SkillAC({value,onChange}){
  const [open,setOpen]=useState(false);
  const [q,setQ]=useState(value||'');
  const ref=useRef();
  const suggestions=q.trim().length>0
    ?TECH_SKILLS.filter(s=>s.toLowerCase().includes(q.toLowerCase())&&s.toLowerCase()!==q.toLowerCase()).slice(0,10)
    :[];
  useEffect(()=>{
    const h=e=>{
      const fmenu=document.querySelector('.fmenu');
      if(fmenu&&fmenu.contains(e.target))return;
      if(ref.current&&!ref.current.contains(e.target))setOpen(false);
    };
    const s=e=>{
      // Only close if scroll is outside the skill autocomplete itself
      if(ref.current&&ref.current.contains(e.target))return;
      setOpen(false);
    };
    document.addEventListener('mousedown',h);
    window.addEventListener('scroll',s,true);
    return()=>{document.removeEventListener('mousedown',h);window.removeEventListener('scroll',s,true);};
  },[]);
  const pick=s=>{setQ(s);onChange(s);setOpen(false);};
  const handleChange=e=>{const v=e.target.value;setQ(v);onChange(v);setOpen(v.trim().length>0);};
  return(
    <div className="skill-ac" ref={ref}>
      <span className="search-ico" style={{fontSize:'.72rem'}}>🏷</span>
      <input type="text" placeholder="Filter by skill..." value={q} onChange={handleChange} onFocus={()=>q.trim()&&setOpen(true)}/>
      {open&&suggestions.length>0&&(
        <div className="ac-list">
          {suggestions.map(s=><div key={s} className="ac-item" onMouseDown={()=>pick(s)}>{s}</div>)}
        </div>
      )}
    </div>
  );
}

function FilterMenu({modeF,portalF,levelF,locationF,matchOnly,resumeFile,hasSkills,onMode,onPortal,onLevel,onLocation,onMatchOnly,onResume,onClearResume}){
  const toggle=(arr,val,setter,reload)=>{
    let next;
    if(val==='all'||val.startsWith('all')){next=['all'+val.slice(3)];}  // all modes/levels/portals
    else if(arr.includes(val)){next=arr.filter(x=>x!==val);if(!next.length)next=['all'];}
    else{next=[...arr.filter(x=>!x.startsWith('all')),val];}
    setter(next);if(reload)reload(next);
  };
  const [open,setOpen]=useState(false);
  const ref=useRef();
  const hasFilters=(!modeF.includes('all')&&modeF.length>0)||(!portalF.includes('all')&&portalF.length>0)||(!levelF.includes('all')&&levelF.length>0)||(!locationF.includes('all')&&locationF.length>0)||matchOnly;
  useEffect(()=>{
    const h=e=>{
      const fmenu=document.querySelector('.fmenu');
      if(fmenu&&fmenu.contains(e.target))return;
      if(ref.current&&!ref.current.contains(e.target))setOpen(false);
    };
    let userScrolled=false;
    const s=e=>{
      // Only close on user-initiated scroll of main content
      const fmenu=document.querySelector('.fmenu');
      if(fmenu&&fmenu.contains(e.target))return;
      if(ref.current&&ref.current.contains(e.target))return;
      // Only close if it's the window/body scrolling, not job list internal scroll
      const jobScroll=document.querySelector('.job-scroll');
      if(jobScroll&&jobScroll.contains(e.target))return;
      if(e.target===document||e.target===document.body||e.target===document.documentElement)setOpen(false);
    };
    document.addEventListener('mousedown',h);
    window.addEventListener('scroll',s,true);
    return()=>{document.removeEventListener('mousedown',h);window.removeEventListener('scroll',s,true);};
  },[]);
  const MODES=[['all','All modes'],['remote','Remote'],['hybrid','Hybrid'],['onsite','Onsite']];
  const LEVELS=[['all','All levels'],['junior','Junior / Entry'],['mid','Mid level'],['senior','Senior+']];
  const PORTAL_LIST=[['all','All portals'],...Object.entries(PORTALS)];
  return(
    <div className="fmenu-wrap" ref={ref}>
      <button className="btn btn-icon fmenu-btn" onClick={()=>setOpen(o=>!o)}>
        ⚙ Filters{hasFilters&&<span className="fmenu-dot"/>}
      </button>
      {open&&(
        <div className="fmenu" ref={el=>{if(el){const btn=ref.current?.querySelector('.fmenu-btn');if(btn){const r=btn.getBoundingClientRect();const navH=parseInt(getComputedStyle(document.documentElement).getPropertyValue('--hh')||'64');el.style.top=Math.max(navH+4,r.bottom+6)+'px';el.style.right=(window.innerWidth-r.right)+'px';}}}}>
          <div className="fmenu-sec">Work mode</div>
          <div className="fmenu-chips">
            {MODES.map(([v,l])=><span key={v} className={'fchip'+(modeF.includes(v)?' on':'')} onClick={()=>toggle(modeF,v,onMode)}>{l}</span>)}
          </div>
          <div className="fmenu-div"/>
          <div className="fmenu-sec">Level</div>
          <div className="fmenu-chips">
            {LEVELS.map(([v,l])=><span key={v} className={'fchip'+(levelF.includes(v)?' on':'')} onClick={()=>toggle(levelF,v,onLevel)}>{l}</span>)}
          </div>
          <div className="fmenu-div"/>
          <div className="fmenu-sec">Portal</div>
          <div className="fmenu-chips">
            {PORTAL_LIST.map(([v,l])=><span key={v} className={'fchip'+(portalF.includes(v)?' on':'')} onClick={()=>toggle(portalF,v,onPortal)}>{l}</span>)}
          </div>
          <div className="fmenu-div"/>
          <div className="fmenu-sec">Location</div>
          <div className="fmenu-chips">
            {[['india','India'],['hyderabad','Hyderabad'],['bengaluru','Bengaluru'],['mumbai','Mumbai'],['pune','Pune'],['chennai','Chennai'],['us','USA'],['uk','UK']].map(([v,l])=><span key={v} className={'fchip'+(locationF.includes(v)?' on':'')} onClick={()=>toggle(locationF,v,onLocation)}>{l}</span>)}
          </div>

        </div>
      )}
    </div>
  );
}


function PfSelect({value,onChange,options,placeholder}){

  const ref=React.useRef();
  React.useEffect(()=>{
    const h=e=>{if(ref.current&&!ref.current.contains(e.target))setOpen(false);};
    document.addEventListener('mousedown',h);
    return()=>document.removeEventListener('mousedown',h);
  },[]);
  const norm=o=>typeof o==='string'?{value:o,label:o}:o;
  const opts=options.map(norm);
  const sel=opts.find(o=>o.value===value);
  const lbl=sel?sel.label:(placeholder||'Select…');
  return(
    <div ref={ref} style={{position:'relative',width:'100%'}}>
      <button type="button" className="pf-input" onClick={()=>setOpen(o=>!o)}
        style={{display:'flex',alignItems:'center',gap:6,cursor:'pointer',textAlign:'left',
          color:sel?'var(--txt)':'var(--txt3)',border:'1.5px solid var(--bdr)'}}>
        <span style={{flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{lbl}</span>
        <svg width="10" height="10" viewBox="0 0 12 12" fill="none" style={{flexShrink:0,opacity:.45,transform:open?'rotate(180deg)':'none',transition:'transform .18s'}}>
          <path d="M2 4l4 4 4-4" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/>
        </svg>
      </button>
      {open&&(
        <div style={{position:'absolute',top:'calc(100% + 4px)',left:0,right:0,background:'var(--bg2)',
          border:'1px solid var(--bdr2)',borderRadius:10,boxShadow:'0 8px 32px rgba(0,0,0,.28)',
          zIndex:300,overflow:'hidden',maxHeight:220,overflowY:'auto'}}>
          {opts.map(o=>{
            const active=o.value===value;
            return(
              <div key={o.value} onClick={()=>{onChange({target:{value:o.value}});setOpen(false);}}
                style={{padding:'.5rem .9rem',cursor:'pointer',fontSize:'.84rem',userSelect:'none',
                  color:active?'var(--accent)':'var(--txt)',
                  background:active?'var(--pur-lo)':'transparent',
                  fontWeight:active?600:400}}
                onMouseEnter={e=>{if(!active)e.currentTarget.style.background='var(--surf2)';}}
                onMouseLeave={e=>{if(!active)e.currentTarget.style.background=active?'var(--pur-lo)':'transparent';}}>
                {o.label}
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

function ProfilePage({onClose}){
  const SECS=[

    {id:'personal',ico:'👤',lbl:'Personal Info'},
    {id:'professional',ico:'💼',lbl:'Professional'},
    {id:'skills',ico:'🛠',lbl:'Skills'},
    {id:'education',ico:'🎓',lbl:'Education'},
    {id:'prefs',ico:'⚙',lbl:'Preferences'},
  ];
  const [sec,setSec]=useState('resume');
  const [profile,setProfile]=useState(null);
  const [saving,setSaving]=useState(false);
  const [saved,setSaved]=useState(false);
  const [parsing,setParsing]=useState(false);
  const [drag,setDrag]=useState(false);
  const [si,setSi]=useState({languages:'',frameworks:'',tools:''});
  const [trInput,setTrInput]=useState('');
  const [certInput,setCertInput]=useState('');
  const ref=useRef();
  const cRef=useRef();

  const dflt=()=>({
    personal:{first_name:'',last_name:'',email:'',phone:'',linkedin:'',github:'',portfolio:'',location:''},
    professional:{current_title:'',current_company:'',years_experience:0,target_roles:[],work_mode_preference:'hybrid',willing_to_relocate:false,notice_period:'30 days'},
    skills:{languages:[],frameworks:[],tools:[],certifications:[]},
    education:{degree:'',field:'',institution:'',year:''},
    answers:{salary_expectation:'',work_authorization:'Authorized to work in India',notice_period:'30 days',cover_letter_tone:'professional'},
  });

  useEffect(()=>{
    fetch('/api/profile').then(r=>r.json()).then(d=>setProfile(d)).catch(()=>setProfile(dflt()));
    if(ref.current) gsap.from(ref.current,{opacity:0,duration:.28,ease:'power2.out'});
  },[]);

  const animSec=()=>{setTimeout(()=>{if(cRef.current){gsap.from(cRef.current.querySelectorAll('.pf-anim'),{opacity:0,y:12,stagger:.04,duration:.28,ease:'power2.out'});}},30);};
  const goSec=id=>{setSec(id);animSec();};

  const set=(s,k,v)=>setProfile(p=>({...p,[s]:{...p[s],[k]:v}}));
  const addSkill=(cat,val)=>{const v=val.trim();if(!v)return;setProfile(p=>({...p,skills:{...p.skills,[cat]:[...new Set([...(p.skills[cat]||[]),v])]}}));setSi(x=>({...x,[cat]:''}));};
  const rmSkill=(cat,sk)=>setProfile(p=>({...p,skills:{...p.skills,[cat]:(p.skills[cat]||[]).filter(s=>s!==sk)}}));
  const addTag=(field,val,setter)=>{const v=val.trim();if(!v)return;setProfile(p=>({...p,skills:{...p.skills,[field]:[...new Set([...(p.skills[field]||[]),v])]}}));setter('');};

  const save=async()=>{
    setSaving(true);setSaved(false);
    await fetch('/api/profile',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(profile)});
    setSaving(false);setSaved(true);setTimeout(()=>setSaved(false),2500);toast('Profile saved ✓');
  };

  const parseFile=async file=>{
    if(!file)return;
    setParsing(true);toast('Parsing resume…');
    const fd=new FormData();fd.append('file',file);
    try{
      const r=await fetch('/api/resume/parse-profile',{method:'POST',body:fd});
      const d=await r.json();
      if(r.ok){
        setProfile(prev=>{
          const m=JSON.parse(JSON.stringify(prev||dflt()));
          for(const sec of Object.keys(d)){
            if(sec.startsWith('_'))continue;
            if(m[sec]&&typeof m[sec]==='object'){
              for(const[k,v]of Object.entries(d[sec])){
                const cur=m[sec][k];
                if(!cur||cur===''||(Array.isArray(cur)&&cur.length===0)||cur===0||cur===false)m[sec][k]=v;
              }
            }
          }
          m.resume_meta={filename:file.name,parsed_at:new Date().toISOString(),size:Math.round(file.size/1024)+'KB'};
          return m;
        });
        const sc=d._meta?.skill_count||0;
        toast('Resume parsed — '+sc+' skills found! Review each section and save.');
        goSec('personal');
      }else toast('Parse error: '+(d.detail||'unknown'));
    }catch(e){toast('Parse failed');}
    setParsing(false);
  };

  if(!profile)return<div ref={ref} className="pf-ov" style={{display:'flex',alignItems:'center',justifyContent:'center'}}><div className="spin" style={{width:24,height:24,border:'2.5px solid var(--bdr2)',borderTopColor:'var(--pur)'}}/></div>;

          <button className="btn" onClick={onClose} style={{height:28,width:28,padding:0,fontSize:'.74rem',lineHeight:'28px',justifyContent:'center'}}>✕</button>
        </div>
      </div>

      <div className="pf-body">
        <div className="pf-nav">
          {SECS.map(s=>(
            <div key={s.id} className={'pf-nav-item'+(sec===s.id?' on':'')} onClick={()=>goSec(s.id)}>

        <div className="pf-content" ref={cRef}>

            <div className="pf-sec-title pf-anim">📄 Resume</div>

                <div style={{display:'flex',alignItems:'center',gap:10}}>
                  <span style={{fontSize:'1.6rem'}}>📄</span>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontWeight:600,fontSize:'.82rem',color:'var(--txt)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{p.resume_meta.filename}</div>

                  <div style={{display:'flex',gap:6,flexShrink:0}}>
                    <label className="btn btn-icon" style={{cursor:'pointer',fontSize:'.72rem',color:'var(--pur2)'}}>

                    </label>
                    <button className="btn btn-icon" onClick={()=>setProfile(pr=>({...pr,resume_meta:null}))} style={{fontSize:'.72rem',color:'var(--red)'}}>✕ Remove</button>

          {sec==='education'&&(<div className="profile-section">
            <div className="pf-sec-title pf-anim">🎓 Education</div>

              <div className="pf-field"><div className="pf-label">Field of Study</div><input className="pf-input" value={p.education.field} onChange={e=>set('education','field',e.target.value)} placeholder="Computer Science"/></div>
            </div>
            <div className="pf-row pf-anim">
              <div className="pf-field"><div className="pf-label">Institution</div><input className="pf-input" value={p.education.institution} onChange={e=>set('education','institution',e.target.value)} placeholder="IIT Hyderabad"/></div>
              <div className="pf-field"><div className="pf-label">Graduation Year</div><input className="pf-input" type="number" min="1990" max="2030" value={p.education.year} onChange={e=>set('education','year',e.target.value)} placeholder="2022"/></div>
            </div>
          </div>)}

          {sec==='prefs'&&(<div className="profile-section">
            <div className="pf-sec-title pf-anim">⚙ Preferences</div>
            <div className="pf-field pf-anim"><div className="pf-label">Salary Expectation</div><input className="pf-input" value={p.answers.salary_expectation} onChange={e=>set('answers','salary_expectation',e.target.value)} placeholder="e.g. 25–35 LPA or As per company norms"/></div>
            <div className="pf-field pf-anim"><div className="pf-label">Work Authorization</div><input className="pf-input" value={p.answers.work_authorization} onChange={e=>set('answers','work_authorization',e.target.value)} placeholder="Authorized to work in India"/></div>
            <div className="pf-field pf-anim">
              <div className="pf-label">Cover Letter Tone</div>
              <div style={{display:'flex',gap:7,marginTop:'.3rem'}}>
                {[['professional','Professional'],['conversational','Conversational'],['enthusiastic','Enthusiastic']].map(([v,l])=><button key={v} className={'pf-mode-btn'+(p.answers.cover_letter_tone===v?' on':'')} onClick={()=>set('answers','cover_letter_tone',v)}>{l}</button>)}
              </div>
              <div style={{fontSize:'.71rem',color:'var(--txt3)',marginTop:'.4rem'}}>Applied when generating AI cover letters for this profile</div>
            </div>
          </div>)}

        </div>
      </div>

      <div className="pf-footer">
        <div style={{fontSize:'.73rem',color:'var(--txt3)'}}>All fields are optional but improve auto-fill accuracy significantly.</div>
      </div>
    </div>
  );
}

  const apiFetch=useCallback(async(url,opts={})=>{

    return r;
  },[]);
  const loadStats=useCallback(async()=>{try{const r=await apiFetch('/api/stats');if(r)setStats(await r.json());}catch(e){}},[apiFetch]);
  const loadJobs=useCallback(async(params={})=>{

    const apiStatus=currentTab==='inbox'?'all_new':currentTab;
    const _modeF=params.modeF||modeF;const _portalF=params.portalF||portalF;const _locF=params.locationF!==undefined?params.locationF:locationF;
    const p=new URLSearchParams({status:apiStatus});
    if(_modeF.length===1&&!_modeF.includes('all'))p.set('mode',_modeF[0]);
    if(_portalF.length===1&&!_portalF.includes('all'))p.set('portal',_portalF[0]);

    setLoading(false);
  },[tab,modeF,portalF,search,locationF]);
  const pollStatus=useCallback(async()=>{
    try{const r=await apiFetch('/api/discovery/status');const d=await r.json();setDisc(d);if(d.last_new_count!=null&&d.last_new_count>0)setHdrMeta('+'+d.last_new_count+' last scan');else if(d.last_new_count===0)setHdrMeta('');if(d.last_scan_completed_at)setLastScanAt(d.last_scan_completed_at);}catch(e){}
  },[]);

  useEffect(()=>{
    let es;
    function connect(){
      es=new EventSource('/api/discovery/stream');

      es.addEventListener('status',e=>{const d=JSON.parse(e.data);setDisc(prev=>{if(prev.status==='running'&&d.status!=='running'){loadStats();loadJobs();}return d;});if(d.last_new_count!=null&&d.last_new_count>0)setHdrMeta('+'+d.last_new_count+' last scan');else if(d.last_new_count===0)setHdrMeta('');});
      es.onerror=()=>{es.close();setTimeout(connect,6000);};
    }
    connect();return()=>es&&es.close();
  },[loadStats,loadJobs]);

  useEffect(()=>{
    // Check AI configuration on mount
    fetch('/api/settings/ai').then(r=>r.json()).then(d=>{
      const active=!!(d.is_configured);
      setAiActive(active);
      document.getElementById('app-html').setAttribute('data-ai',active?'active':'');
    }).catch(()=>{});
  },[]);
  useEffect(()=>{loadJobs();loadStats();pollStatus();const i1=setInterval(()=>{loadStats();pollStatus();},15000);const i2=setInterval(()=>loadJobs(),22000);return()=>{clearInterval(i1);clearInterval(i2);};},[]);

  useEffect(()=>{
    if(heroRef.current){
      gsap.from(heroRef.current.querySelectorAll('.hero-eyebrow,.hero-title,.hero-sub'),{opacity:0,y:24,stagger:.08,duration:.65,ease:'power2.out'});

    toast(ids.length+' jobs marked as '+status);
  };

    if(detail&&detail.id===job.id)setDetail({...detail,status});

    if(['skipped','reviewed','applied'].includes(status))loadJobs();
  };
  const startDisc=async()=>{await fetch('/api/discovery/start',{method:'POST'});setDisc(d=>({...d,status:'starting'}));setFeedPaused(false);feedPausedRef.current=false;setFeedOpen(true);toast('Discovery started');};
  const stopDisc=async()=>{await fetch('/api/discovery/stop',{method:'POST'});setDisc(d=>({...d,status:'stopped'}));toast('Discovery stopped');};
  const scanNow=async()=>{await fetch('/api/discovery/trigger',{method:'POST'});setDisc(d=>({...d,status:'running'}));setFeedPaused(false);feedPausedRef.current=false;setFeedOpen(true);toast('Scanning now!');};
  const refresh=()=>{loadJobs();loadStats();toast('Refreshed');};
  const purge=()=>setConfirmDlg({icon:'🗂',title:'Purge Suspicious Jobs',message:'Remove all suspicious or mislabeled new jobs from the database? This cannot be undone.',confirmLabel:'Purge Jobs',onConfirm:async()=>{setConfirmDlg(null);await fetch('/api/discovery/stop',{method:'POST'});setDisc(d=>({...d,status:'stopped'}));setFeedPaused(false);feedPausedRef.current=false;clearFeed();const r=await fetch('/api/jobs/purge-suspicious',{method:'DELETE'});const d=await r.json();loadJobs();loadStats();toast('Purged '+d.deleted+' suspicious jobs');}});
  const clearDb=()=>setConfirmDlg({
    icon:'🗑',title:'Clear Jobs Database',
    message:'Permanently delete all your discovered jobs. Choose whether to trigger a new scan immediately after.',

    altLabel:'Clear Only',
    onAlt:async()=>{setConfirmDlg(null);await fetch('/api/discovery/stop',{method:'POST'});setDisc(d=>({...d,status:'stopped'}));setFeedPaused(false);feedPausedRef.current=false;clearFeed();const r=await fetch('/api/jobs/clear-only',{method:'DELETE'});const d=await r.json();setJobs([]);setHdrMeta('');setLastScanAt(null);setDisc(prev=>({...prev,last_new_count:0,status:'idle'}));loadStats();toast('Cleared '+d.deleted+' jobs');}
  });
  const signOut=()=>setConfirmDlg({icon:'🚪',title:'Sign out?',message:'You will be signed out and redirected to the login page.',confirmLabel:'Sign Out',onConfirm:async()=>{setConfirmDlg(null);await fetch('/auth/logout',{method:'POST'});window.location.href='/';},});

  const toggleTheme=()=>{
    const next=!isDark;const t=next?'dark':'light';

    overlay.style.background=next?'#0c0c0c':'#f5f2ed';overlay.style.transition='none';overlay.style.transform='translateY(-100%)';void overlay.offsetWidth;

    if(scanLine){scanLine.style.transition='none';scanLine.style.top='0px';void scanLine.offsetWidth;scanLine.style.transition=`top ${dur}ms cubic-bezier(.4,0,.2,1)`;scanLine.style.top='100vh';}
    setTimeout(()=>{setIsDark(next);document.getElementById('app-html').setAttribute('data-theme',t);localStorage.setItem('jb-theme',t);},dur*0.55);

  const handleSearch=e=>{const v=e.target.value;setSearch(v);clearTimeout(searchTimer.current);searchTimer.current=setTimeout(()=>loadJobs({search:v}),280);};

  const handleResume=async e=>{

      const fd=new FormData();fd.append('file',file);
      const r=await fetch('/api/resume/parse',{method:'POST',body:fd});
      const d=await r.json();
      if(r.ok){setResumeSkills(d.skills);localStorage.setItem('jb-skills',JSON.stringify(d.skills));toast('Resume parsed — '+d.skills.length+' skills found');}

    if(locationF.length>0&&!locationF.includes('all')){const jloc=(j.location||'').toLowerCase();const match=locationF.some(loc=>{const terms=LOC_TERMS[loc]||[loc.toLowerCase()];return terms.some(t=>jloc.includes(t));});if(!match)return false;}
    if(levelF.length>0&&!levelF.includes('all')){const lv=detectLevel(j.title);if(lv!=='unknown'&&!levelF.includes(lv))return false;}
    if(skillsF.trim()){const sk=skillsF.toLowerCase().split(',').map(s=>s.trim()).filter(Boolean);const hay=(j.title+' '+(j.description||'')).toLowerCase();if(!sk.every(s=>hay.includes(s)))return false;}
    if(portalF.length>0&&!portalF.includes('all')){if(!portalF.includes((j.portal||'').toLowerCase()))return false;}
    if(modeF.length>0&&!modeF.includes('all')){const wm=j.work_mode||'unknown';if(wm!=='unknown'&&!modeF.includes(wm))return false;}
    if(matchOnly&&resumeSkills.length>0&&scoreMatch(j,resumeSkills)<30)return false;
    return true;
  }).sort((a,b)=>{
    if(sortBy==='newest')return (new Date(b.discovered_at))-(new Date(a.discovered_at));

    if(sortBy==='company')return (a.company||'').localeCompare(b.company||'');
    if(sortBy==='match')return aiActive?(b.ai_score||0)-(a.ai_score||0):scoreMatch(b,resumeSkills)-scoreMatch(a,resumeSkills);

    {applyJob&&<ApplyModal job={applyJob} onClose={()=>setApplyJob(null)} onApplied={j=>{updateJob(j,"applied");setApplyJob(null);}}/>}
    {showAbout&&<AboutModal onClose={()=>setShowAbout(false)}/>}
    {showAccount&&<AccountModal onClose={()=>setShowAccount(false)}/>}
    {showConfig&&<ConfigPanel onClose={()=>setShowConfig(false)}/>}
    {showAISettings&&<AISettingsModal onClose={()=>setShowAISettings(false)} onConfigured={active=>{setAiActive(active);localStorage.setItem('jb-ai',active?'1':'0');document.getElementById('app-html').setAttribute('data-ai',active?'active':'');}}/>}
    {showProfile&&<ProfilePage onClose={()=>{setShowProfile(false);fetch('/api/profile').then(r=>r.ok?r.json():null).then(p=>{if(!p)return;const sk=[...(p.skills?.languages||[]),...(p.skills?.frameworks||[]),...(p.skills?.tools||[]),...(p.skills?.databases||[])];if(sk.length)setResumeSkills(sk);}).catch(()=>{});}}/>}
    {detail&&<DetailDrawer job={detail} isNew={isNewJob(detail)} onClose={()=>setDetail(null)} onApprove={j=>updateJob(j,'reviewed')} onSkip={j=>updateJob(j,'skipped')} onMarkApplied={j=>updateJob(j,'applied')} onUnreview={j=>updateJob(j,'new')} onRestore={j=>updateJob(j,getPrevStatus(j))} onAutoApply={j=>{setDetail(null);if(j.status==='new')updateJob(j,'reviewed');setApplyJob(j);}} aiActive={aiActive}/>}
    <div style={{position:'relative',zIndex:1}}>

              </div>

              <div style={{display:'inline-flex',alignItems:'center',gap:2,background:'var(--surf)',border:'1px solid var(--bdr)',borderRadius:8,padding:2,flexShrink:0}}>
                {[
                  ['newest',<svg width="11" height="11" viewBox="0 0 12 12" fill="none"><circle cx="6" cy="6" r="4.5" stroke="currentColor" strokeWidth="1.3"/><path d="M6 3.5V6l1.5 1.5" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round"/></svg>,'New'],
                  ['oldest',<svg width="11" height="11" viewBox="0 0 12 12" fill="none"><circle cx="6" cy="6" r="4.5" stroke="currentColor" strokeWidth="1.3"/><path d="M6 8.5V6l-1.5-1.5" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round"/></svg>,'Old'],
                  ['company',<svg width="11" height="11" viewBox="0 0 12 12" fill="none"><rect x="2" y="4" width="8" height="7" rx="1" stroke="currentColor" strokeWidth="1.3"/><path d="M4 4V3a2 2 0 014 0v1" stroke="currentColor" strokeWidth="1.3"/></svg>,'A–Z'],
                  ['match',<svg width="11" height="11" viewBox="0 0 12 12" fill="none"><path d="M6 1.5l1.2 2.4 2.7.4-1.95 1.9.46 2.66L6 7.5 3.57 8.9l.46-2.66L2.1 4.3l2.7-.4z" stroke="currentColor" strokeWidth="1.2" strokeLinejoin="round"/></svg>,'Best'],
                ].map(([v,ico,lbl])=>(

            </div>

                  <div className="skill-tags" style={{flex:1}}>
                    {resumeSkills.slice(0,showAllSkills?resumeSkills.length:8).map(s=><span key={s} className="skill-tag">{s}<span className="sk-rm" onClick={()=>removeSkill(s)}>✕</span></span>)}
                    {resumeSkills.length>8&&<span style={{fontSize:'.65rem',color:'var(--accent)',cursor:'pointer',fontWeight:600}} onClick={()=>setShowAllSkills(p=>!p)}>{showAllSkills?'show less':'+'+( resumeSkills.length-8)+' more'}</span>}
                  </div>

            {loading&&<div style={{textAlign:'center',padding:'2.5rem'}}><div className="spin" style={{width:20,height:20,border:'2.5px solid var(--bdr2)',borderTopColor:'var(--pur)',display:'inline-block'}}/></div>}
            {aiResults&&<div className="ai-result-hdr"><span>✦ AI results for <b style={{color:'var(--txt)'}}>"{aiQuery}"</b></span><span style={{marginLeft:'auto'}}>{aiResults.length} matches</span></div>}
            {(()=>{const vs=[...selectedIds].filter(id=>filteredJobs.some(j=>j.id===id));return vs.length>0&&<div className="bulk-bar"><span className="bb-count">{vs.length} selected</span>{tab==='inbox'&&<><button onClick={()=>bulkAction('reviewed')}>✓ Approve all</button><button onClick={()=>bulkAction('skipped')}>Skip all</button></>}{tab==='reviewed'&&<><button onClick={()=>bulkAction('applied')}>✓ Applied</button><button onClick={()=>bulkAction('new')}>↩ Unreview all</button><button onClick={()=>bulkAction('skipped')}>Skip all</button></>}{tab==='applied'&&<button onClick={()=>bulkAction('reviewed')}>↩ Undo Applied</button>}{tab==='skipped'&&<button onClick={()=>bulkAction('new')}>↩ Undo all</button>}<button className="bb-desel" onClick={clearSelection}>✕</button></div>;})()}
            {!loading&&(aiResults||filteredJobs).length>0&&<div className="jlist">{(aiResults||filteredJobs).map(j=><JobCard key={j.id} job={j} isNew={isNewJob(j)} onClick={()=>setDetail(j)} resumeSkills={resumeSkills} selected={selectedIds.has(j.id)} onSelect={toggleSelect} onApprove={job=>updateJob(job,'reviewed')} onSkip={job=>updateJob(job,'skipped')} onMarkApplied={job=>updateJob(job,'applied')} onUnreview={job=>updateJob(job,'new')} onRestore={job=>updateJob(job,getPrevStatus(job))} onOpen={async job=>{try{await fetch('/api/jobs/'+job.id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:'reviewed'})});setJobs(prev=>prev.map(j=>j.id===job.id?{...j,status:'reviewed'}:j));loadStats();}catch(e){}}} aiScore={j.ai_score} aiReasons={j.ai_reasons}/>)}</div>}
            {!loading&&filteredJobs.length===0&&<div className="empty"><div className="empty-ico">🔭</div><div className="empty-t">{tab==='inbox'?'Inbox is empty':'Nothing here'}</div><div className="empty-s">{tab==='inbox'?'Run a scan to populate your inbox':'Try a different tab or filter'}</div></div>}
          </div>
        </main>
        <FeedPanel feed={feed} isOpen={feedOpen} onClose={toggleFeed} isRunning={isRunning} paused={feedPaused} onTogglePause={toggleFeedPause} onClear={clearFeed}/>
      </div>
      <footer className="footer">
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <div className="footer-brand">JobBot</div>
          <span style={{fontSize:".65rem",color:"var(--txt3)",fontFamily:"var(--mono)"}}>v3.0 · AI-powered</span>
        </div>
        <div className="footer-txt" style={{textAlign:"center"}}>LinkedIn · Naukri · Indeed · Monster · Glassdoor · Greenhouse · HiringCafe · Instahire · Uplers</div>
        <div className="footer-txt" style={{cursor:"pointer",color:"var(--pur2)"}} onClick={()=>setShowAbout(true)}>About &amp; Features ↗</div>
      </footer>
    </div>
  </>);
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
