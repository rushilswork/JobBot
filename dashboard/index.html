<!DOCTYPE html>
<html lang="en" id="app-html" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' https://unpkg.com https://cdnjs.cloudflare.com https://fonts.googleapis.com https://fonts.gstatic.com; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://unpkg.com https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self' https://unpkg.com https://cdnjs.cloudflare.com;">
<title>JobBot — Automated Pipeline</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#0c0c0c;--bg2:#111111;--bg3:#161616;
  --surf:rgba(255,255,255,.04);--surf2:rgba(255,255,255,.07);--surf3:rgba(255,255,255,.11);
  --bdr:rgba(255,255,255,.07);--bdr2:rgba(255,255,255,.12);--bdr3:rgba(255,255,255,.2);
  --txt:#f0ece4;--txt2:rgba(240,236,228,.65);--txt3:rgba(240,236,228,.38);
  --accent:#c9922a;--accent2:#b08530;
  --pur:#c9922a;--pur2:#b08530;--pur-lo:rgba(201,146,42,.1);--pur-glow:rgba(201,146,42,.28);
  --cyn:#38bdf8;--grn:#4ade80;--ylw:#c9922a;--red:#f87171;
  --mono:'JetBrains Mono',monospace;
  --r:12px;--r-sm:8px;--r-lg:18px;--hh:64px;
}
[data-theme="light"]{
  --bg:#f5f2ed;--bg2:#ede9e2;--bg3:#e4dfd6;
  --surf:rgba(0,0,0,.04);--surf2:rgba(0,0,0,.07);--surf3:rgba(0,0,0,.11);
  --bdr:rgba(0,0,0,.1);--bdr2:rgba(0,0,0,.16);--bdr3:rgba(0,0,0,.24);
  --txt:#1a1814;--txt2:rgba(26,24,20,.62);--txt3:rgba(26,24,20,.4);
  --accent:#9a6318;--accent2:#9a6318;
  --pur:#9a6318;--pur2:#9a6318;--pur-lo:rgba(154,99,24,.08);--pur-glow:rgba(154,99,24,.2);
}
[data-theme="light"] .footer{background:rgba(237,233,226,.95);border-top:1px solid rgba(0,0,0,.08);padding:.5rem 2rem;}
[data-theme="light"] .footer-brand{color:#1c150a;}
[data-theme="light"] .footer-txt{color:rgba(28,21,10,.45);}
[data-theme="light"] .nav{background:rgba(245,242,237,.96)!important;border-bottom:1px solid rgba(0,0,0,.08);}
[data-theme="light"] .hbg-menu{background:rgba(248,245,240,.98);border-color:rgba(0,0,0,.1);box-shadow:0 12px 40px rgba(80,50,15,.14),0 0 0 0.5px rgba(101,67,33,.08);}
[data-theme="light"] .ai-recents-dd{background:rgba(248,245,240,.97);border-color:rgba(0,0,0,.1);box-shadow:0 16px 48px rgba(80,50,15,.15);}
[data-theme="light"] .fmenu{background:rgba(248,245,240,.97);border-color:rgba(0,0,0,.1);box-shadow:0 20px 60px rgba(80,50,15,.15);}
[data-theme="light"] .feed-col{background:#ede9e2;border-left-color:rgba(0,0,0,.08);}
[data-theme="light"] .jcard{background:#fff;border-color:rgba(0,0,0,.08);}
[data-theme="light"] .jcard:hover{background:#fdfaf5;border-color:rgba(154,99,24,.35);}
[data-theme="light"] .jcard.selected{border-color:rgba(154,99,24,.4);background:rgba(154,99,24,.04);}
[data-theme="light"] .tabs{border-bottom-color:rgba(101,67,33,.12);}
[data-theme="light"] select{background:#fff;color:#1c150a;}
[data-theme="light"] .search-wrap input{background:#fff;color:#1c150a;}
[data-theme="light"] .skill-ac input{background:#fff;color:#1c150a;}

/* ── AI-ACTIVE PALETTE (deep violet) ────────────────────────────────── */
[data-ai="active"]{
  --pur:#c9922a;--pur2:#b08530;--pur-lo:rgba(201,146,42,.12);--pur-glow:rgba(201,146,42,.35);
  --accent:#c9922a;--accent2:#b08530;
}
[data-ai="active"][data-theme="light"]{
  --accent:#a0740a;--accent2:#c4920e;
  --pur:#c9922a;--pur2:#b08530;--pur-lo:rgba(201,146,42,.1);--pur-glow:rgba(201,146,42,.28);
}
[data-ai="active"] .nav{background:rgba(14,10,4,.96)!important;border-bottom-color:rgba(201,146,42,.3);}
[data-ai="active"][data-theme="light"] .nav{background:rgba(245,242,237,.97)!important;border-bottom:1px solid rgba(154,99,24,.25);box-shadow:0 4px 24px rgba(154,99,24,.07);}
[data-ai="active"][data-theme="light"] .btn-p{box-shadow:0 0 14px rgba(154,99,24,.35),0 2px 8px rgba(154,99,24,.2);}
[data-ai="active"][data-theme="light"] .jcard:hover{border-color:rgba(154,99,24,.4);box-shadow:0 0 16px rgba(154,99,24,.1);}
[data-ai="active"][data-theme="light"] .ai-nav-btn{background:rgba(154,99,24,.1);border-color:rgba(154,99,24,.4);color:#9a6318;box-shadow:0 0 14px rgba(154,99,24,.2);}
[data-ai="active"] .logo-em{color:var(--pur2);}
[data-ai="active"] .ai-nav-btn{
  background:rgba(201,146,42,.1);
  border-color:rgba(201,146,42,.45);color:#b08530;
  box-shadow:0 0 14px rgba(201,146,42,.22),0 0 0 1px rgba(201,146,42,.1);
  animation:ai-pulse 2.8s ease-in-out infinite;
}
[data-ai="active"] .ai-nav-btn:hover{
  background:rgba(201,146,42,.16);
  box-shadow:0 0 22px rgba(201,146,42,.35),0 0 0 1px rgba(201,146,42,.18);
}
[data-ai="active"] .tab.active{border-bottom-color:#c9922a;color:#c9922a;}
[data-ai="active"] .btn-p{background:var(--pur);}
[data-ai="active"] .jcard:hover{border-color:rgba(201,146,42,.4);}
[data-ai="active"] .ai-panel{border-color:rgba(201,146,42,.2);background:rgba(201,146,42,.04);}
[data-ai="active"] .ai-panel-hdr{color:var(--pur2);}
[data-ai="active"] .ai-tab.active{border-bottom-color:#c9922a;color:#c9922a;}
[data-ai="active"] .ai-score-big.strong{background:rgba(201,146,42,.12);border-color:rgba(201,146,42,.25);}
[data-ai="active"] .hero-eyebrow{color:var(--pur2);}

@keyframes ai-pulse{0%,100%{box-shadow:0 0 10px rgba(14,165,233,.18),0 0 0 1px rgba(14,165,233,.06);}50%{box-shadow:0 0 22px rgba(14,165,233,.38),0 0 0 1px rgba(14,165,233,.18);}}

/* AI-locked panel (shown when AI not configured) */
.ai-locked{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2.5rem 1.5rem;gap:.75rem;text-align:center;}
.ai-locked-ico{font-size:2rem;opacity:.5;}
.ai-locked-title{font-size:.82rem;font-weight:600;color:var(--txt2);}
.ai-locked-sub{font-size:.73rem;color:var(--txt3);line-height:1.5;max-width:240px;}
.ai-locked-btn{margin-top:.25rem;padding:7px 18px;background:var(--pur);color:#fff;border:none;border-radius:8px;font-size:.73rem;font-weight:600;cursor:pointer!important;font-family:'Inter',sans-serif;transition:opacity .15s;}
.ai-locked-btn:hover{opacity:.85;}

/* AI-active navbar accent bar */
[data-ai="active"] .nav::after{content:'';position:absolute;bottom:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,#c9922a,#b08530,#c9922a,transparent);opacity:.8;}
[data-ai="active"][data-theme="light"] .nav::after{background:linear-gradient(90deg,transparent,rgba(154,99,24,.6),#c4920e,rgba(154,99,24,.6),transparent);opacity:1;}


/* ── HAMBURGER MENU ─────────────────────────────────────────────── */
.hbg-wrap{position:relative;}
.hbg-btn{background:none;border:1px solid var(--bdr2);border-radius:9px;padding:8px 10px;color:var(--txt2);cursor:pointer!important;display:flex;flex-direction:column;gap:4px;align-items:center;justify-content:center;transition:all .18s;height:36px;}
.hbg-btn:hover{border-color:var(--pur);color:var(--pur);background:var(--pur-lo);}
.hbg-line{display:block;width:15px;height:1.8px;background:currentColor;border-radius:2px;transition:all .25s cubic-bezier(.4,0,.2,1);transform-origin:center;}
@keyframes menuIn{from{opacity:0;transform:translateY(-6px) scale(.975);}to{opacity:1;transform:translateY(0) scale(1);}}
.hbg-menu{position:absolute;top:calc(100% + 8px);right:0;width:210px;background:var(--bg2);border:1px solid var(--bdr2);border-radius:14px;padding:.3rem .3rem .4rem;z-index:300;box-shadow:0 16px 48px rgba(0,0,0,.6),0 0 0 0.5px rgba(201,146,42,.08);overflow:hidden;animation:menuIn .18s cubic-bezier(.16,1,.3,1) forwards;backdrop-filter:blur(24px);}
.hbg-section{padding:.55rem .7rem .18rem;font-size:.56rem;font-weight:700;letter-spacing:1.3px;text-transform:uppercase;color:var(--txt3);}
.hbg-item{display:flex;align-items:center;gap:9px;padding:6.5px 9px;border-radius:8px;font-size:.79rem;font-weight:500;color:var(--txt2);cursor:pointer!important;transition:background .1s,color .1s;width:100%;border:none;background:none;text-align:left;font-family:'Inter',sans-serif;}
.hbg-item:hover{background:var(--surf3);color:var(--txt);}
.hbg-item.ai-on{color:var(--pur2);}
.hbg-item.ai-on:hover{background:var(--pur-lo);}
.hbg-item.danger{color:var(--txt3);}
.hbg-item.danger:hover{background:rgba(239,68,68,.09);color:var(--red);}
.hbg-item.signout{color:var(--txt3);}
.hbg-item.signout:hover{background:rgba(239,68,68,.09);color:var(--red);}
.hbg-sep{height:1px;background:var(--bdr);margin:.28rem .4rem;}
.hbg-ico{font-size:.82rem;width:18px;text-align:center;flex-shrink:0;opacity:.7;}
.hbg-item:hover .hbg-ico{opacity:1;}
.hbg-item.ai-on .hbg-ico{opacity:1;}

/* ── PROFILE PAGE ────────────────────────────────────────────────── */
.pf-ov{position:fixed;inset:0;z-index:200;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;}
.pf-hdr{height:60px;display:flex;align-items:center;padding:0 1.5rem;gap:1rem;border-bottom:1px solid var(--bdr);background:var(--bg2);flex-shrink:0;}
.pf-hdr-title{font-family:'Syne',sans-serif;font-size:1.05rem;font-weight:800;letter-spacing:-.3px;}
.pf-hdr-sub{font-size:.72rem;color:var(--txt3);}
.pf-body{display:flex;flex:1;overflow:hidden;}
.pf-nav{width:210px;flex-shrink:0;border-right:1px solid var(--bdr);padding:1.2rem .8rem;display:flex;flex-direction:column;gap:3px;background:var(--bg2);overflow-y:auto;}
.pf-nav-item{display:flex;align-items:center;gap:9px;padding:9px 12px;border-radius:9px;font-size:.8rem;font-weight:500;color:var(--txt2);cursor:pointer!important;transition:all .12s;}
.pf-nav-item:hover{background:var(--surf);color:var(--txt);}
.pf-nav-item.on{background:var(--pur-lo);color:var(--pur2);font-weight:600;}
.pf-content{flex:1;overflow-y:auto;padding:2rem;}
.pf-sec-title{font-family:'Syne',sans-serif;font-size:1.2rem;font-weight:800;letter-spacing:-.4px;color:var(--txt);margin-bottom:1.4rem;}
.pf-field{margin-bottom:1.1rem;}
.pf-label{font-size:.67rem;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--txt3);margin-bottom:.4rem;}
.pf-input{width:100%;padding:9px 13px;background:var(--surf);border:1.5px solid var(--bdr);border-radius:9px;color:var(--txt);font-family:'Inter',sans-serif;font-size:.84rem;outline:none;transition:border-color .15s;}
.pf-input:focus{border-color:var(--pur);}
.pf-row{display:grid;grid-template-columns:1fr 1fr;gap:1rem;}
@media(max-width:680px){.pf-row{grid-template-columns:1fr;}}
.pf-tag{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;background:var(--surf2);border:1px solid var(--bdr);border-radius:20px;font-size:.72rem;color:var(--txt2);margin:3px;}
.pf-tag-rm{cursor:pointer!important;color:var(--txt3);font-size:.75rem;line-height:1;}
.pf-tag-rm:hover{color:var(--red);}
.pf-add-row{display:flex;gap:8px;}
.pf-tag-suggestions{display:flex;flex-wrap:wrap;gap:4px;margin-top:.45rem;}
.pf-sug{font-size:.65rem;padding:2px 9px;border-radius:12px;border:1px dashed var(--bdr2);color:var(--txt3);cursor:pointer!important;transition:all .1s;}
.pf-sug:hover{border-color:var(--pur);color:var(--pur);}
.pf-resume-zone{border:2px dashed var(--bdr2);border-radius:14px;padding:2.2rem;text-align:center;cursor:pointer!important;transition:all .2s;margin-bottom:1.5rem;background:var(--surf);}
.pf-resume-zone:hover,.pf-resume-zone.drag{border-color:var(--pur);background:var(--pur-lo);}
.pf-resume-ico{font-size:2.2rem;margin-bottom:.5rem;}
.pf-resume-title{font-size:.9rem;font-weight:700;color:var(--txt);margin-bottom:.25rem;}
.pf-resume-sub{font-size:.73rem;color:var(--txt3);}
.pf-footer{display:flex;align-items:center;gap:10px;padding:1rem 1.5rem;border-top:1px solid var(--bdr);background:var(--bg2);flex-shrink:0;}
.pf-mode-btn{padding:6px 14px;border-radius:7px;border:1px solid var(--bdr2);background:var(--surf);color:var(--txt2);font-size:.78rem;cursor:pointer!important;font-family:'Inter',sans-serif;transition:all .12s;}
.pf-mode-btn.on{background:var(--pur);border-color:var(--pur);color:#fff;}

html{scroll-behavior:smooth;}
body{background:var(--bg);color:var(--txt);font-family:'Inter',sans-serif;font-size:14px;line-height:1.5;min-height:100vh;overflow-x:hidden;cursor:default;-webkit-font-smoothing:antialiased;transition:background .35s,color .25s;padding-top:var(--hh);}
*{cursor:default;}
a,button,select,input,label,[role="button"]{cursor:pointer!important;}
#root{position:relative;z-index:1;}
::-webkit-scrollbar{width:3px;height:3px;}::-webkit-scrollbar-track{background:transparent;}::-webkit-scrollbar-thumb{background:var(--bdr2);border-radius:3px;}
/* Nav */
.nav{position:fixed;top:0;left:0;right:0;height:var(--hh);z-index:100;display:flex;align-items:center;padding:0 2rem;gap:1.2rem;background:rgba(8,8,8,.82);backdrop-filter:saturate(180%) blur(24px);-webkit-backdrop-filter:saturate(180%) blur(24px);border-bottom:1px solid var(--bdr);}
.logo{font-family:'Syne',sans-serif;font-size:1.1rem;font-weight:800;letter-spacing:-.5px;user-select:none;flex-shrink:0;cursor:pointer!important;}
.logo-em{color:var(--accent);}
.nav-sep{width:1px;height:18px;background:var(--bdr);margin:0 2px;}
.s-pill{display:inline-flex;align-items:center;gap:6px;padding:3px 11px;border-radius:100px;font-size:.68rem;font-weight:600;background:var(--surf);border:1px solid var(--bdr);white-space:nowrap;}
.s-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
.s-run{background:var(--grn);animation:blink 1.3s ease-in-out infinite;}
.s-idle{background:var(--accent);}
.s-stop{background:var(--red);}
.s-err{background:var(--ylw);}
@keyframes blink{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.2;transform:scale(.65)}}
/* Buttons */
.btn{display:inline-flex;align-items:center;gap:5px;cursor:pointer!important;font-family:'Inter',sans-serif;font-size:.74rem;font-weight:500;padding:5px 12px;border-radius:8px;border:1px solid var(--bdr);background:var(--surf);color:var(--txt2);transition:background .15s,border-color .15s,color .12s;white-space:nowrap;}
.btn:hover{background:var(--surf2);border-color:var(--bdr2);color:var(--txt);}
.btn:active{opacity:.8;}
.btn:disabled{opacity:.38;pointer-events:none;}
.btn-p{background:var(--accent);border-color:transparent;color:#fff;font-weight:600;overflow:visible;line-height:1.4;}
.btn-p:hover{background:var(--accent2);color:#fff;}
.btn-stop{border-color:rgba(239,68,68,.3);color:#f87171;}
.btn-stop:hover{background:rgba(239,68,68,.09);border-color:rgba(239,68,68,.45);}
.btn-link{background:none;border:none;color:var(--cyn);padding:4px 6px;font-size:.71rem;}
.btn-link:hover{background:rgba(56,189,248,.08);border-radius:5px;}
.btn-ok:hover{background:rgba(34,197,94,.09);border-color:rgba(34,197,94,.28);color:#4ade80;}
.btn-no:hover{background:rgba(239,68,68,.08);border-color:rgba(239,68,68,.22);color:#f87171;}
.btn-icon{padding:5px 9px;}
.btn-ghost{background:transparent;border-color:transparent;color:var(--txt);opacity:.7;}
.btn-ghost:hover{background:var(--surf2);border-color:var(--bdr);color:var(--txt);opacity:1;}
.nav-group{display:flex;align-items:center;gap:4px;background:var(--surf);border:1px solid var(--bdr);border-radius:10px;padding:3px;}
.nav-group .btn{border:none;background:transparent;border-radius:7px;padding:5px 11px;color:var(--txt);opacity:.75;font-size:.85rem;}
.nav-group .btn:hover{background:var(--surf2);opacity:1;}
/* Settings dropdown */
.settings-wrap{position:relative;}
.settings-menu{position:absolute;top:calc(100% + 8px);right:0;min-width:220px;background:var(--bg2);border:1px solid var(--bdr2);border-radius:14px;padding:.4rem .4rem .5rem;z-index:300;box-shadow:0 24px 64px rgba(0,0,0,.6),0 0 0 0.5px rgba(201,146,42,.08);backdrop-filter:blur(24px);animation:menuIn .18s cubic-bezier(.16,1,.3,1) forwards;}
.smenu-sec{padding:.35rem .85rem .1rem;font-size:.59rem;font-weight:700;letter-spacing:1.3px;text-transform:uppercase;color:var(--txt3);}
.smenu-row{display:flex;align-items:center;gap:9px;padding:.42rem .85rem;font-size:.76rem;color:var(--txt2);cursor:pointer!important;transition:background .12s,color .12s;}
.smenu-row:hover{background:var(--surf2);color:var(--txt);}
.smenu-row.active{color:var(--pur2);}
.smenu-ico{width:16px;text-align:center;flex-shrink:0;}
.smenu-check{margin-left:auto;font-size:.68rem;color:var(--pur2);}
/* Badges */
.bdg{display:inline-flex;align-items:center;padding:2px 7px;border-radius:5px;font-size:.61rem;font-weight:600;letter-spacing:.5px;font-family:var(--mono);}
.b-remote{background:rgba(34,197,94,.09);color:#4ade80;border:1px solid rgba(34,197,94,.17);}
.b-hybrid{background:rgba(245,158,11,.09);color:#fbbf24;border:1px solid rgba(245,158,11,.17);}
.b-onsite{background:rgba(239,68,68,.09);color:#f87171;border:1px solid rgba(239,68,68,.17);}
.b-portal{background:rgba(99,102,241,.09);color:#a5b4fc;border:1px solid rgba(99,102,241,.17);}
.b-new{background:rgba(56,189,248,.09);color:#7dd3fc;border:1px solid rgba(56,189,248,.17);}
.b-reviewed{background:rgba(201,146,42,.07);color:#c9922a;border:1px solid rgba(201,146,42,.15);}
.b-applied{background:rgba(34,197,94,.09);color:#4ade80;border:1px solid rgba(34,197,94,.17);}
.b-skipped,.b-failed{background:rgba(239,68,68,.07);color:#f87171;border:1px solid rgba(239,68,68,.12);}
.b-applying{background:rgba(201,146,42,.09);color:#b08530;border:1px solid rgba(201,146,42,.17);}
.match-score{display:inline-flex;align-items:center;padding:2px 7px;border-radius:5px;font-size:.61rem;font-weight:700;font-family:var(--mono);background:rgba(34,197,94,.12);color:#4ade80;border:1px solid rgba(34,197,94,.2);}
.match-score.mid{background:rgba(245,158,11,.1);color:#fbbf24;border-color:rgba(245,158,11,.2);}
.match-score.low{background:rgba(99,102,241,.09);color:#a5b4fc;border-color:rgba(99,102,241,.15);}
/* Hero */
.hero-title-accent{color:var(--accent);}
.stats-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;}
@media(max-width:900px){.stats-grid{grid-template-columns:repeat(4,1fr);}}
@media(max-width:560px){.stats-grid{grid-template-columns:repeat(2,1fr);}}
.stat-card{background:var(--surf);border:1px solid var(--bdr);border-radius:var(--r);padding:.9rem 1rem;cursor:default;transition:background .2s,border-color .2s;}
.stat-card:hover{border-color:var(--bdr2);background:var(--surf2);}
.stat-n{font-family:'Syne',sans-serif;font-size:2rem;font-weight:800;letter-spacing:-1.5px;line-height:1;}
.stat-l{font-size:.59rem;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:var(--txt2);margin-top:4px;}
/* Resume bar */
.resume-bar{display:flex;align-items:flex-start;gap:7px;flex-wrap:wrap;padding:.55rem 1rem;background:rgba(201,146,42,.04);border-bottom:1px solid rgba(201,146,42,.1);font-size:.75rem;max-height:80px;overflow-y:auto;transition:max-height .25s ease;}.resume-bar.expanded{max-height:160px;}
.resume-name{color:var(--accent2);font-family:var(--mono);font-size:.68rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:160px;}
.skill-tags{display:flex;gap:4px;flex-wrap:wrap;align-items:center;flex:1;}
.skill-tag{display:inline-flex;align-items:center;padding:1px 7px;border-radius:4px;font-size:.6rem;font-weight:600;font-family:var(--mono);background:rgba(201,146,42,.08);color:var(--accent2);border:1px solid rgba(201,146,42,.18);}
.sk-rm{margin-left:4px;cursor:pointer!important;opacity:.55;}
.sk-rm:hover{opacity:1;}
/* Layout */
.body-wrap{display:flex;align-items:flex-start;min-height:calc(100vh - var(--hh));}
.main-col{flex:1;min-width:0;padding:.75rem 1.5rem;}
.feed-col{width:0;overflow:hidden;border-left:0 solid var(--bdr);background:var(--bg2);display:flex;flex-direction:column;flex-shrink:0;position:sticky;top:var(--hh);height:calc(100vh - var(--hh) - 38px);transition:width .35s cubic-bezier(.16,1,.3,1),border-width .35s;}
.feed-col.open{width:320px;border-left-width:1px;}
@media(max-width:1100px){.feed-col.open{width:280px;}}
@media(max-width:768px){.feed-col.open{position:fixed;right:0;top:var(--hh);bottom:0;width:300px!important;border-left-width:1px;z-index:40;box-shadow:-8px 0 32px rgba(0,0,0,.5);}}
/* Filters */
.filters{display:flex;gap:7px;margin-bottom:.85rem;flex-wrap:wrap;align-items:center;}
.search-wrap{flex:1;min-width:150px;position:relative;}
.search-wrap input{width:100%;background:var(--surf);border:1px solid var(--bdr);color:var(--txt);font-size:.74rem;font-family:'Inter',sans-serif;padding:5px .75rem 5px 2rem;border-radius:8px;outline:none;transition:background .15s,border-color .15s;cursor:text!important;}
.search-wrap input::placeholder{color:var(--txt3);}
.search-wrap input:focus{border-color:rgba(154,99,24,.5);background:var(--surf2);}
.search-ico{position:absolute;left:.65rem;top:50%;transform:translateY(-50%);color:var(--txt3);pointer-events:none;font-size:.74rem;}
select{background:var(--surf);border:1px solid var(--bdr);color:var(--txt);font-size:.78rem;font-family:'Inter',sans-serif;padding:.5rem .8rem;border-radius:8px;outline:none;cursor:pointer!important;transition:background .15s,border-color .15s;}
select:focus{border-color:rgba(201,146,42,.55);}
/* Tabs */
.tabs{display:flex;border-bottom:1px solid var(--bdr);margin-bottom:.9rem;}
.tab{padding:6px 14px;font-size:.74rem;font-weight:500;color:var(--txt2);cursor:pointer!important;border:none;background:none;font-family:'Inter',sans-serif;border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .15s,border-color .15s;white-space:nowrap;}
.tab:hover{color:var(--txt);}
.tab.active{color:var(--accent2);border-bottom-color:var(--accent);}
/* Job list */
.jlist{display:flex;flex-direction:column;gap:6px;}
.jcard{background:var(--surf);border:1px solid var(--bdr);border-radius:var(--r);padding:1rem 1.1rem;cursor:pointer;display:flex;gap:.9rem;align-items:flex-start;transition:background .18s,border-color .18s,box-shadow .18s;position:relative;overflow:hidden;}
.jcard::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent);opacity:0;transition:opacity .2s;}
.jcard:hover{border-color:rgba(201,146,42,.3);background:rgba(201,146,42,.02);box-shadow:0 4px 20px rgba(0,0,0,.15);}
.jcard:hover::before{opacity:1;}
.av{width:40px;height:40px;border-radius:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:700;font-family:'Syne',sans-serif;letter-spacing:-.3px;}
.av-unknown{background:rgba(128,128,150,.08)!important;color:rgba(180,180,200,.35)!important;border:1px dashed rgba(128,128,150,.18)!important;}
.jbody{flex:1;min-width:0;}
.jtitle{font-family:'Syne',sans-serif;font-size:.95rem;font-weight:700;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:2px;line-height:1.3;}
.jco{font-size:.8rem;font-weight:600;color:var(--txt);margin-bottom:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.jloc{font-size:.73rem;color:var(--txt2);margin-bottom:6px;}
.jbdgs{display:flex;gap:4px;flex-wrap:wrap;align-items:center;}
.jacts{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap;}
.jright{display:flex;flex-direction:column;align-items:flex-end;flex-shrink:0;gap:4px;}
.jtime{font-size:.63rem;color:var(--txt3);font-family:var(--mono);}
/* Spinner */
.spin{display:inline-block;border-radius:50%;animation:rot .5s linear infinite;}
@keyframes rot{to{transform:rotate(360deg)}}
/* Empty state */
.empty{text-align:center;padding:4.5rem 2rem;}
.empty-ico{font-size:2.8rem;margin-bottom:.65rem;opacity:.2;}
.empty-t{font-family:'Syne',sans-serif;font-size:.95rem;font-weight:700;color:var(--txt2);margin-bottom:.35rem;}
.empty-s{font-size:.76rem;color:var(--txt3);}
/* Feed */
.feed-hdr{height:48px;padding:0 1rem;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--bdr);}
.feed-ttl{font-size:.65rem;font-weight:600;letter-spacing:1.1px;text-transform:uppercase;color:var(--txt2);}
.log{flex:1;overflow-y:auto;padding:.65rem .85rem 1.5rem;display:flex;flex-direction:column;gap:1px;font-family:var(--mono);font-size:.67rem;}
.lrow{display:flex;gap:8px;padding:3px 0;border-bottom:1px solid rgba(128,128,128,.06);line-height:1.45;}
.lt{color:var(--txt3);flex-shrink:0;min-width:52px;}
.lm{color:var(--txt2);word-break:break-word;}
.lm.pos{color:#4ade80;}.lm.err{color:#f87171;}.lm.done{color:#c9922a;}
.log-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:7px;color:var(--txt3);font-size:.72rem;text-align:center;}
/* Drawer overlay */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(8px);z-index:200;display:flex;justify-content:flex-end;align-items:stretch;}
.dp{width:100%;max-width:500px;background:var(--bg2);border-left:1px solid var(--bdr2);overflow-y:auto;padding:1.4rem;}
.dp-hdr{display:flex;align-items:flex-start;gap:.75rem;margin-bottom:.7rem;}
.dp-ttl{font-family:'Syne',sans-serif;font-size:1.1rem;font-weight:800;letter-spacing:-.5px;flex:1;line-height:1.2;}
.dp-sec{margin-top:1rem;}
.dp-lbl{font-size:.62rem;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--txt3);margin-bottom:.4rem;}
.dp-val{font-size:.82rem;color:var(--txt2);line-height:1.65;}
textarea{width:100%;background:var(--surf);border:1px solid var(--bdr);color:var(--txt);font-family:var(--mono);font-size:.73rem;padding:.65rem .75rem;border-radius:9px;resize:vertical;line-height:1.6;outline:none;transition:border-color .15s;cursor:text!important;}
textarea:focus{border-color:rgba(201,146,42,.55);}
/* Link preview */
.preview-wrap{margin-top:1rem;border-radius:var(--r);overflow:hidden;border:1px solid var(--bdr);}
.preview-bar{display:flex;align-items:center;justify-content:space-between;padding:.4rem .8rem;background:var(--bg3);border-bottom:1px solid var(--bdr);font-size:.62rem;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:var(--txt3);}
.preview-wrap iframe{width:100%;height:400px;border:none;display:block;background:var(--bg3);}
.preview-blocked{display:flex;flex-direction:column;align-items:center;justify-content:center;height:110px;gap:7px;color:var(--txt3);font-size:.74rem;text-align:center;padding:1rem;}
/* Toast */
.toast{position:fixed;bottom:1.4rem;right:1.4rem;background:var(--bg3);border:1px solid var(--bdr2);color:var(--txt);padding:.6rem 1.1rem;border-radius:9px;font-size:.77rem;z-index:9000;transition:opacity .28s,transform .28s;pointer-events:none;}
/* Footer */
.footer{position:fixed;bottom:0;left:0;right:0;z-index:50;border-top:1px solid var(--bdr);padding:.75rem 2rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.75rem;background:rgba(8,8,8,.9);backdrop-filter:saturate(180%) blur(24px);-webkit-backdrop-filter:saturate(180%) blur(24px);}
.footer-txt{font-size:.72rem;color:var(--txt3);letter-spacing:.01em;}
.footer-brand{font-family:'Syne',sans-serif;font-size:.88rem;font-weight:800;letter-spacing:-.3px;color:var(--txt);}
/* Filter menu */
.fmenu-wrap{position:relative;overflow:visible;z-index:10;}
.fmenu-btn{position:relative;}
.fmenu-dot{position:absolute;top:-3px;right:-3px;width:7px;height:7px;border-radius:50%;background:var(--accent2);border:1.5px solid var(--bg);}
.fmenu{position:fixed;width:310px;max-height:72vh;overflow-y:auto;overscroll-behavior:contain;background:var(--bg2);border:1px solid var(--bdr2);border-radius:16px;padding:.5rem .5rem .7rem;z-index:350;box-shadow:0 24px 64px rgba(0,0,0,.6),0 0 0 0.5px rgba(201,146,42,.08);backdrop-filter:blur(24px);animation:menuIn .2s cubic-bezier(.16,1,.3,1) forwards;}.fmenu::-webkit-scrollbar{width:3px;}.fmenu::-webkit-scrollbar-thumb{background:var(--bdr2);border-radius:3px;}
.ai-recents-dd{position:absolute;top:calc(100% + 5px);left:0;right:0;background:var(--bg2);border:1px solid var(--bdr2);border-radius:14px;z-index:400;overflow:hidden;box-shadow:0 20px 56px rgba(0,0,0,.55),0 0 0 0.5px rgba(201,146,42,.08);backdrop-filter:blur(22px);animation:menuIn .18s cubic-bezier(.16,1,.3,1) forwards;}
.ai-recents-hdr{display:flex;justify-content:space-between;align-items:center;padding:.5rem .85rem .3rem;border-bottom:1px solid var(--bdr);}
.ai-recents-lbl{font-size:.59rem;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--txt3);}
.ai-recents-clear{background:none;border:none;cursor:pointer!important;font-size:.68rem;color:var(--txt3);padding:2px 8px;border-radius:6px;transition:color .1s,background .1s;font-family:inherit;}
.ai-recents-clear:hover{color:var(--txt);background:var(--surf2);}
.ai-recent-item{display:flex;align-items:center;justify-content:space-between;padding:.48rem .85rem;cursor:pointer!important;font-size:.8rem;color:var(--txt2);gap:8px;transition:background .1s,color .1s;}
.ai-recent-item:hover{background:var(--surf2);color:var(--txt);}
.ai-recent-rm{background:none;border:none;cursor:pointer!important;color:var(--txt3);font-size:.7rem;padding:2px 7px;border-radius:5px;flex-shrink:0;transition:color .1s,background .1s;font-family:inherit;}
.ai-recent-rm:hover{color:var(--red);background:rgba(239,68,68,.08);}
.fmenu-sec{padding:.3rem .9rem .1rem;font-size:.58rem;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--txt3);margin-top:.3rem;}
.fmenu-row{display:flex;align-items:center;gap:10px;padding:.38rem .9rem;font-size:.78rem;color:var(--txt2);}
.fmenu-row label{font-size:.73rem;color:var(--txt2);min-width:60px;}
.fmenu-row select{flex:1;padding:.32rem .6rem;font-size:.75rem;}
.fmenu-chips{display:flex;gap:4px;flex-wrap:wrap;padding:.25rem .9rem .5rem;}
.fchip{padding:3px 10px;border-radius:20px;font-size:.68rem;font-weight:600;cursor:pointer!important;border:1px solid var(--bdr);background:var(--surf);color:var(--txt2);transition:all .12s;}
.fchip:hover,.fchip.on{background:rgba(201,146,42,.1);border-color:var(--accent2);color:var(--accent2);}
.fmenu-div{height:1px;background:var(--bdr);margin:.4rem 0;}
/* Skill autocomplete */
.skill-ac{position:relative;flex:1;min-width:180px;}
.skill-ac input{width:100%;background:var(--surf);border:1px solid var(--bdr);color:var(--txt);font-size:.74rem;font-family:'Inter',sans-serif;padding:5px .75rem 5px 2rem;border-radius:8px;outline:none;transition:background .15s,border-color .15s;cursor:text!important;}
.skill-ac input:focus{border-color:rgba(154,99,24,.5);background:var(--surf2);}
.skill-ac input::placeholder{color:var(--txt3);}
.ac-list{position:absolute;top:calc(100% + 4px);left:0;min-width:220px;background:var(--bg2);border:1px solid var(--bdr2);border-radius:12px;padding:.3rem .3rem .4rem;z-index:500;box-shadow:0 20px 56px rgba(0,0,0,.55),0 0 0 0.5px rgba(201,146,42,.08);backdrop-filter:blur(20px);max-height:200px;overflow-y:auto;animation:menuIn .16s cubic-bezier(.16,1,.3,1) forwards;}
.ac-item{padding:.38rem .85rem;font-size:.76rem;color:var(--txt2);cursor:pointer!important;transition:background .1s,color .1s;font-family:var(--mono);}
.ac-item:hover{background:var(--surf2);color:var(--txt);}
.tab-count{font-size:.6rem;font-weight:700;background:rgba(201,146,42,.15);color:var(--accent2);border-radius:10px;padding:1px 6px;margin-left:4px;font-family:var(--mono);}
.filters-row{display:flex;gap:7px;margin-bottom:.85rem;align-items:center;flex-wrap:nowrap;}
.job-scroll{padding-bottom:5rem;}



.sticky-bar{padding-bottom:2px;overflow:visible;}
.modal-form input{background:var(--surf);border:1px solid var(--bdr);color:var(--txt);font-size:.78rem;font-family:'Inter',sans-serif;padding:.45rem .75rem;border-radius:8px;outline:none;transition:border-color .15s;cursor:text!important;}
.modal-form input:focus{border-color:rgba(201,146,42,.55);}
.modal-form input::placeholder{color:var(--txt3);}
/* About modal */
.about-modal{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(20px);z-index:600;display:flex;align-items:center;justify-content:center;padding:1.5rem;overflow-y:auto;}
.about-card{background:var(--bg2);border:1px solid var(--bdr2);border-radius:24px;padding:2.5rem;max-width:560px;width:100%;max-height:88vh;overflow-y:auto;box-shadow:0 32px 80px rgba(0,0,0,.3);}
.about-logo{font-family:'Syne',sans-serif;font-size:2rem;font-weight:800;letter-spacing:-1.5px;margin-bottom:.25rem;color:var(--txt);}
.about-logo span{color:var(--accent);}
.about-ver{font-size:.72rem;color:var(--txt3);font-family:var(--mono);margin-bottom:2rem;}
.about-grid{display:grid;grid-template-columns:1fr 1fr;gap:.65rem;margin-bottom:2rem;}
.about-feat{background:var(--surf);border:1px solid var(--bdr);border-radius:14px;padding:.9rem 1rem;}
.about-feat-icon{font-size:1.3rem;margin-bottom:.4rem;}
.about-feat-title{font-size:.8rem;font-weight:700;color:var(--txt);margin-bottom:.2rem;}
.about-feat-desc{font-size:.7rem;color:var(--txt2);line-height:1.5;}
.about-portals{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:2rem;}
.about-portal-tag{padding:4px 12px;border-radius:20px;font-size:.68rem;font-weight:600;background:rgba(201,146,42,.08);color:var(--accent2);border:1px solid rgba(201,146,42,.18);}
.about-close{width:100%;padding:.75rem;border-radius:12px;background:var(--accent);border:none;color:#fff;font-size:.85rem;font-weight:600;cursor:pointer!important;font-family:'Inter',sans-serif;transition:background .15s;}
.about-close:hover{background:var(--accent2);}

#theme-overlay{position:fixed;inset:0;z-index:9999;pointer-events:none;transform:translateY(-100%);}
#theme-overlay .scan-line{position:absolute;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,rgba(201,146,42,.8),transparent);box-shadow:0 0 20px rgba(201,146,42,.6);}

.cfg-modal{position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(12px);z-index:600;display:flex;align-items:center;justify-content:center;padding:1.5rem;}
.cfg-card{background:var(--bg2);border:1px solid var(--bdr2);border-radius:20px;padding:2rem;max-width:620px;width:100%;max-height:88vh;overflow-y:auto;box-shadow:0 24px 64px rgba(0,0,0,.4);}
.cfg-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem;}
.cfg-title{font-family:'Syne',sans-serif;font-size:1.1rem;font-weight:800;letter-spacing:-.3px;}
.cfg-sec{margin-bottom:1.5rem;}
.cfg-sec-title{font-size:.62rem;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--txt3);margin-bottom:.65rem;}
.cfg-tag-wrap{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:.5rem;}
.cfg-tag{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;font-size:.72rem;font-weight:600;background:var(--surf);border:1px solid var(--bdr);color:var(--txt2);}
.cfg-tag .rm{cursor:pointer;opacity:.5;font-size:.75rem;line-height:1;transition:opacity .1s;}
.cfg-tag .rm:hover{opacity:1;color:var(--red);}
.cfg-add-row{display:flex;gap:6px;margin-top:.4rem;}
.cfg-add-row input{flex:1;background:var(--surf);border:1px solid var(--bdr);color:var(--txt);font-size:.78rem;font-family:'Inter',sans-serif;padding:.42rem .75rem;border-radius:8px;outline:none;}
.cfg-add-row input:focus{border-color:var(--accent);}
.cfg-add-row button{padding:.42rem .9rem;border-radius:8px;background:var(--accent);border:none;color:#fff;font-size:.75rem;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;}
.portal-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.portal-row{display:flex;align-items:center;justify-content:space-between;padding:.55rem .8rem;border-radius:10px;background:var(--surf);border:1px solid var(--bdr);}
.portal-name{font-size:.78rem;font-weight:600;color:var(--txt);}
.portal-badge{font-size:.62rem;color:var(--txt3);font-family:var(--mono);}
.toggle{width:36px;height:20px;border-radius:10px;border:none;cursor:pointer;position:relative;transition:background .2s;flex-shrink:0;}
.toggle.on{background:var(--accent);}
.toggle.off{background:var(--bdr2);}
.toggle::after{content:'';position:absolute;top:3px;width:14px;height:14px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.3);}
.toggle.on::after{left:19px;}
.toggle.off::after{left:3px;}

.jcard{position:relative;}
.jcard-cb{position:absolute;top:1rem;left:.8rem;width:16px;height:16px;accent-color:var(--accent);cursor:pointer;opacity:0;transition:opacity .15s;z-index:2;}
.jcard:hover .jcard-cb,.jcard-cb:checked{opacity:1;}
.jcard.selected{border-color:rgba(201,146,42,.4);background:rgba(201,146,42,.04);}
.bulk-bar{position:sticky;bottom:52px;left:0;right:0;z-index:50;display:flex;align-items:center;gap:10px;padding:.7rem 1.2rem;background:var(--accent);color:#fff;border-radius:12px;margin:0 0 .5rem;box-shadow:0 8px 24px rgba(201,146,42,.35);animation:slideUp .2s ease;}
@keyframes slideUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.bulk-bar .bb-count{font-weight:700;font-size:.85rem;flex:1;}
.bulk-bar button{background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.3);color:#fff;font-size:.75rem;font-weight:600;padding:5px 14px;border-radius:8px;cursor:pointer;font-family:'Inter',sans-serif;transition:background .15s;}
.bulk-bar button:hover{background:rgba(255,255,255,.35);}
.bulk-bar .bb-desel{background:transparent;border-color:rgba(255,255,255,.2);}

.acct-modal{position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(12px);z-index:600;display:flex;align-items:center;justify-content:center;padding:1.5rem;}
.acct-card{background:var(--bg2);border:1px solid var(--bdr2);border-radius:20px;padding:2rem;max-width:420px;width:100%;box-shadow:0 24px 64px rgba(0,0,0,.4);}
.acct-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem;}
.acct-title{font-family:'Syne',sans-serif;font-size:1.05rem;font-weight:800;letter-spacing:-.3px;}
.acct-avatar{width:52px;height:52px;border-radius:14px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-size:1.2rem;font-weight:800;color:#fff;margin-bottom:1rem;}
.acct-name{font-size:1rem;font-weight:700;color:var(--txt);}
.acct-role{font-size:.72rem;color:var(--txt3);font-family:var(--mono);margin-bottom:1.5rem;}
.acct-sec{margin-bottom:1.2rem;}
.acct-sec-title{font-size:.6rem;font-weight:700;letter-spacing:1.3px;text-transform:uppercase;color:var(--txt3);margin-bottom:.5rem;}
.acct-input{width:100%;background:var(--surf);border:1px solid var(--bdr);color:var(--txt);font-size:.82rem;font-family:'Inter',sans-serif;padding:.5rem .8rem;border-radius:8px;outline:none;margin-bottom:.5rem;transition:border-color .15s;}
.acct-input:focus{border-color:var(--accent);}
.acct-btn{width:100%;padding:.65rem;border-radius:10px;border:none;font-family:'Inter',sans-serif;font-size:.82rem;font-weight:600;cursor:pointer;transition:background .15s;}
.acct-btn.primary{background:var(--accent);color:#fff;}
.acct-btn.primary:hover{background:#9a6e22;}
.acct-btn.danger{background:rgba(239,68,68,.08);color:var(--red);border:1px solid rgba(239,68,68,.2);margin-top:.5rem;}

function isUnknown(n){if(!n||!n.trim())return true;const lo=n.toLowerCase().trim();return lo==='unknown'||lo==='unknown company'||lo==='n/a'||lo==='-';}
function detectLevel(t){const lo=t.toLowerCase();for(const[lv,kws]of Object.entries(LEVEL_KW)){if(kws.some(k=>lo.includes(k)))return lv;}return 'unknown';}
function scoreMatch(job,skills){if(!skills||!skills.length)return -1;const hay=(job.title+' '+(job.description||'')).toLowerCase();return Math.round(skills.filter(s=>hay.includes(s.toLowerCase())).length/skills.length*100);}
function extractSkills(text){const lo=text.toLowerCase();return TECH_SKILLS.filter(s=>lo.includes(s));}


function SettingsMenu({onClose,onAccount}){
  const wr=useRef();
  useEffect(()=>{const h=e=>{if(wr.current&&!wr.current.contains(e.target))onClose();};setTimeout(()=>document.addEventListener('mousedown',h),0);return()=>document.removeEventListener('mousedown',h);},[onClose]);
  const logout=async()=>{await fetch('/auth/logout',{method:'POST'});window.location.href='/';};
  return(
    <div className="settings-menu" ref={wr}>
      <div className="smenu-row" onClick={()=>{onAccount&&onAccount();onClose();}}>
        <span>◉</span><span>Account</span>
      </div>
      <div style={{height:'1px',background:'var(--bdr)',margin:'.3rem 0'}}/>
      <div className="smenu-row" onClick={logout} style={{color:'var(--red)'}}>
        <span>⎋</span><span>Sign out</span>
      </div>
    </div>
  );
}

          <button className="btn-cancel" onClick={onCancel}>Cancel</button>

let _toast;
function Toast(){
  const [st,setSt]=useState({msg:'',v:false});
  _toast=useCallback(msg=>{setSt({msg,v:true});setTimeout(()=>setSt(s=>({...s,v:false})),2800);},[]);
  return <div className="toast" style={{opacity:st.v?1:0,transform:st.v?'translateY(0)':'translateY(8px)'}}>{st.msg}</div>;
}
function toast(m){_toast&&_toast(m);}

function Badge({type,label}){return <span className={'bdg b-'+type}>{label}</span>;}

function JobCard({job,onClick,onApprove,onSkip,onMarkApplied,onUnreview,onRestore,onOpen,resumeSkills,selected,onSelect,aiScore,aiReasons,isNew}){
  const unk=isUnknown(job.company);
  const [bg,color]=unk?['',null]:avColor(job.company);
  const match=scoreMatch(job,resumeSkills);
  const mc=match>=60?'':match>=30?'mid':'low';
  return (
    <div className={"jcard"+(selected?" selected":"")} onClick={onClick}>
      <input type="checkbox" className="jcard-cb" checked={!!selected} onChange={e=>{e.stopPropagation();onSelect(job.id);}} onClick={e=>e.stopPropagation()}/>
      <div className={'av'+(unk?' av-unknown':'')} style={unk?{}:{background:bg,color}}>{unk?'?':initials(job.company)}</div>
      <div className="jbody">
        <div className="jtitle">{job.title}</div>
        <div className="jco">{unk?<span style={{color:'var(--txt3)',fontStyle:'italic',fontWeight:400}}>Unknown company</span>:job.company}</div>
        <div className="jloc">{job.location||'Location TBD'}</div>
        <div className="jbdgs">
          {job.work_mode!=='unknown'&&<Badge type={job.work_mode} label={job.work_mode.toUpperCase()}/>}
          <Badge type="portal" label={PORTALS[job.portal]||job.portal}/>
          {job.status!=='new'&&<Badge type={job.status} label={job.status.toUpperCase()}/>}{isNew&&<span style={{background:'var(--accent)',color:'#fff',fontSize:'.65rem',fontWeight:800,padding:'3px 9px',borderRadius:10,letterSpacing:'.8px',display:'inline-flex',alignItems:'center',lineHeight:1}}>NEW</span>}
          {match>=0&&<span className={'match-score '+mc}>⚡{match}%</span>}
          {aiScore!==undefined&&<span className={'ai-score '+(aiScore>=50?'high':aiScore>=25?'mid':'low')}>✦{aiScore}</span>}
        </div>
        <div className="jacts" onClick={e=>e.stopPropagation()}>
          <a href={job.job_url} target="_blank" rel="noreferrer"><button className="btn btn-link" onClick={e=>{e.stopPropagation();onOpen&&onOpen(job);}}>↗ Open</button></a>
          
          
          
          {job.status==='reviewed'&&<button className="btn btn-ok" onClick={()=>onMarkApplied(job)}>Applied</button>}{job.status==='applied'&&<button className="btn btn-icon" onClick={()=>onRestore(job)} style={{fontSize:'.72rem',color:'var(--txt3)'}}>↩ Undo</button>}{job.status==='skipped'&&<button className="btn btn-icon" onClick={()=>onRestore(job)} style={{fontSize:'.72rem',color:'var(--accent)'}}>↩ Undo</button>}
          {!['applied','skipped'].includes(job.status)&&<button className="btn btn-no" onClick={()=>onSkip(job)}>Skip</button>}
        </div>
      </div>
      <div className="jright"><span className="jtime" title={"Discovered: "+ago(job.discovered_at)}>{job.posted_at?"Posted "+ago(job.posted_at):ago(job.discovered_at)}</span></div>
    </div>
  );
}

function LinkPreview({url}){

  const portal = domain.includes('linkedin')?'LinkedIn':domain.includes('naukri')?'Naukri':domain.includes('indeed')?'Indeed':domain.includes('glassdoor')?'Glassdoor':domain.includes('greenhouse')?'Greenhouse':domain.includes('lever')?'Lever':domain.includes('monster')?'Monster':domain.includes('instahire')?'Instahire':domain.includes('uplers')?'Uplers':domain.includes('hiring.cafe')?'HiringCafe':domain;
  return (
    <div className="preview-wrap" style={{background:'var(--bg3)',borderRadius:'var(--r)',border:'1px solid var(--bdr)',overflow:'hidden'}}>
      <div className="preview-bar">
        <span style={{display:'flex',alignItems:'center',gap:6}}>

          <span style={{fontFamily:'var(--mono)',fontSize:'.65rem',color:'var(--txt2)'}}>{domain}</span>
        </span>
        <a href={url} target="_blank" rel="noreferrer"><button className="btn btn-link" style={{padding:'2px 8px',fontSize:'.65rem'}}>Open ↗</button></a>
      </div>
      <div style={{padding:'2rem',display:'flex',flexDirection:'column',alignItems:'center',gap:'1rem',minHeight:180,justifyContent:'center'}}>
        <div style={{width:48,height:48,borderRadius:14,background:'var(--pur-lo)',border:'1px solid rgba(124,58,237,.2)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'1.4rem'}}>🔗</div>
        <div style={{textAlign:'center'}}>
          <div style={{fontSize:'.82rem',fontWeight:600,color:'var(--txt)',marginBottom:4}}>{portal} Job Posting</div>
          <div style={{fontSize:'.72rem',color:'var(--txt3)',fontFamily:'var(--mono)',wordBreak:'break-all',maxWidth:320}}>{url.length>60?url.slice(0,60)+'…':url}</div>

        </a>

  );

  const showPauseResume=isRunning||paused;
  return (
    <aside className={'feed-col'+(isOpen?' open':'')}>
      <div className="feed-hdr">
        <span className="feed-ttl" style={{display:'flex',alignItems:'center',gap:6}}>

          {paused&&<span style={{fontSize:'.58rem',fontWeight:700,letterSpacing:'.5px',color:'var(--ylw)',opacity:.8}}>PAUSED</span>}
        </span>
        <div style={{display:'flex',gap:3,alignItems:'center'}}>

          <button className="btn btn-icon" onClick={onClose} style={{padding:'2px 7px',fontSize:'.67rem',color:'var(--txt3)'}} title="Close feed">✕</button>

    if(!menuOpen)return;
    const close=e=>{if(menuRef.current&&!menuRef.current.contains(e.target))setMenuOpen(false);};

function AccountModal({onClose}){
  const [user,setUser]=useState(null);
  const [tab,setTab]=useState('account');
  const [oldPw,setOldPw]=useState('');
  const [newPw,setNewPw]=useState('');
  const [confirmPw,setConfirmPw]=useState('');
  const [msg,setMsg]=useState('');
  const [err,setErr]=useState('');
  const [saving,setSaving]=useState(false);
  const [users,setUsers]=useState([]);
  const [newUser,setNewUser]=useState({username:'',password:'',role:'viewer'});
  const [createMsg,setCreateMsg]=useState('');
  const [createErr,setCreateErr]=useState('');

  useEffect(()=>{fetch('/auth/me').then(r=>r.json()).then(d=>{setUser(d);if(d.role==='admin')fetch('/auth/users').then(r=>r.json()).then(setUsers);}).catch(()=>{});},[]);

  const changePassword=async()=>{
    setMsg('');setErr('');
    if(newPw!==confirmPw){setErr('Passwords do not match');return;}
    if(newPw.length<8){setErr('Min 8 characters');return;}
    setSaving(true);
    const r=await fetch('/auth/change-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({old_password:oldPw,new_password:newPw})});
    const d=await r.json();
    setSaving(false);
    if(r.ok){setMsg('Password updated!');setOldPw('');setNewPw('');setConfirmPw('');}
    else setErr(d.detail||'Error');
  };

  const createUser=async()=>{
    setCreateErr('');setCreateMsg('');
    if(!newUser.username.trim()||!newUser.password.trim()){setCreateErr('Username and password required');return;}
    if(newUser.password.length<8){setCreateErr('Password min 8 characters');return;}
    const r=await fetch('/auth/users',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(newUser)});
    const d=await r.json();
    if(r.ok){
      setCreateMsg('User created!');
      setNewUser({username:'',password:'',role:'viewer'});
      fetch('/auth/users').then(r=>r.json()).then(setUsers);
    } else setCreateErr(d.detail||'Error');
  };

  const [delConfirm,setDelConfirm]=useState(null);
  const deleteUser=(username)=>setDelConfirm(username);
  const confirmDelete=async()=>{
    const r=await fetch('/auth/users/'+encodeURIComponent(delConfirm),{method:'DELETE'});
    setDelConfirm(null);
    if(r.ok){
      // Re-fetch from server to get accurate list
      fetch('/auth/users').then(r=>r.json()).then(setUsers);
    }
  };

  const logout=async()=>{await fetch('/auth/logout',{method:'POST'});window.location.href='/';};

  const isAdmin=user?.role==='admin';

  return(
    <>{delConfirm&&<ConfirmDialog icon="👤" title={"Delete user \""+delConfirm+"\"?"} message="This user will be permanently removed and will no longer be able to sign in." confirmLabel="Delete User" onConfirm={confirmDelete} onCancel={()=>setDelConfirm(null)}/>}
    <div className="acct-modal" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="acct-card" style={{maxWidth:480}}>
        <div className="acct-hdr">
          <div className="acct-title">Account</div>
          <button className="btn btn-ghost" onClick={onClose} style={{padding:'4px 10px'}}>✕</button>
        </div>
        {user&&<>
          <div className="acct-avatar">{user.username[0].toUpperCase()}</div>
          <div className="acct-name">{user.username}</div>
          <div className="acct-role">{user.role} · Local account</div>
        </>}
        <div style={{display:'flex',gap:4,margin:'1rem 0 1.2rem',borderBottom:'1px solid var(--bdr)',paddingBottom:'-1px'}}>
          {['account', isAdmin&&'users'].filter(Boolean).map(t=>(
            <button key={t} onClick={()=>setTab(t)} style={{padding:'6px 14px',border:'none',background:'none',fontFamily:'Inter,sans-serif',fontSize:'.78rem',fontWeight:600,cursor:'pointer',color:tab===t?'var(--accent)':'var(--txt3)',borderBottom:tab===t?'2px solid var(--accent)':'2px solid transparent',marginBottom:-1,transition:'color .15s'}}>
              {t.charAt(0).toUpperCase()+t.slice(1)}
            </button>
          ))}
        </div>

        {tab==='account'&&<>
          <div className="acct-sec">
            <div className="acct-sec-title">Change Password</div>
            <input className="acct-input" type="password" placeholder="Current password" value={oldPw} onChange={e=>setOldPw(e.target.value)}/>
            <input className="acct-input" type="password" placeholder="New password (min 8 chars)" value={newPw} onChange={e=>setNewPw(e.target.value)}/>
            <input className="acct-input" type="password" placeholder="Confirm new password" value={confirmPw} onChange={e=>setConfirmPw(e.target.value)}/>
            {err&&<div style={{fontSize:'.73rem',color:'var(--red)',marginBottom:'.4rem'}}>{err}</div>}
            {msg&&<div style={{fontSize:'.73rem',color:'var(--grn)',marginBottom:'.4rem'}}>{msg}</div>}
            <button className="acct-btn primary" onClick={changePassword} disabled={saving}>{saving?'Saving...':'Update Password'}</button>
          </div>
          <div className="acct-divider"/>
          <button className="acct-btn danger" onClick={logout}>Sign out</button>
        </>}

        {tab==='users'&&isAdmin&&<>
          <div className="acct-sec">
            <div className="acct-sec-title">Create New User</div>
            <input className="acct-input" placeholder="Username" value={newUser.username} onChange={e=>setNewUser(p=>({...p,username:e.target.value}))}/>
            <input className="acct-input" type="password" placeholder="Password (min 8 chars)" value={newUser.password} onChange={e=>setNewUser(p=>({...p,password:e.target.value}))}/>
            <select style={{width:'100%',marginBottom:'.5rem',padding:'.48rem .75rem',borderRadius:8,border:'1px solid var(--bdr)',background:'var(--surf)',color:'var(--txt)',fontSize:'.8rem',fontFamily:'Inter,sans-serif'}} value={newUser.role} onChange={e=>setNewUser(p=>({...p,role:e.target.value}))}>
              <option value="viewer">Viewer — read only</option>
              <option value="admin">Admin — full access</option>
            </select>
            {createErr&&<div style={{fontSize:'.73rem',color:'var(--red)',marginBottom:'.4rem'}}>{createErr}</div>}
            {createMsg&&<div style={{fontSize:'.73rem',color:'var(--grn)',marginBottom:'.4rem'}}>{createMsg}</div>}
            <button className="acct-btn primary" onClick={createUser}>+ Create User</button>
          </div>
          <div className="acct-divider"/>
          <div className="acct-sec">
            <div className="acct-sec-title">All Users ({users.length})</div>
            {users.map(u=>(
              <div key={u.username} style={{display:'flex',alignItems:'center',gap:8,padding:'.45rem .6rem',borderRadius:8,background:'var(--surf)',border:'1px solid var(--bdr)',marginBottom:6}}>
                <div style={{width:28,height:28,borderRadius:8,background:'var(--accent)',display:'flex',alignItems:'center',justifyContent:'center',color:'#fff',fontWeight:700,fontSize:'.75rem',flexShrink:0}}>{u.username[0].toUpperCase()}</div>
                <div style={{flex:1}}>
                  <div style={{fontSize:'.8rem',fontWeight:600,color:'var(--txt)'}}>{u.username}</div>
                  <div style={{fontSize:'.65rem',color:'var(--txt3)',fontFamily:'var(--mono)'}}>{u.role}</div>
                </div>
                {u.username!==user?.username&&<span onClick={()=>deleteUser(u.username)} style={{cursor:'pointer',color:'var(--txt3)',fontSize:'.75rem',padding:'2px 6px',borderRadius:6,transition:'color .12s'}} onMouseEnter={e=>e.target.style.color='var(--red)'} onMouseLeave={e=>e.target.style.color='var(--txt3)'}>✕</span>}
              </div>
            ))}
          </div>
        </>}
      </div>
    </div>
    </>
  );
}

function AISettingsModal({onClose,onConfigured}){
  const [settings,setSettings]=useState(null);
  const [provider,setProvider]=useState('groq');
  const [apiKey,setApiKey]=useState('');
  const [model,setModel]=useState('');
  const [showKey,setShowKey]=useState(false);
  const [saving,setSaving]=useState(false);
  const [testing,setTesting]=useState(false);
  const [testResult,setTestResult]=useState(null);
  const [msg,setMsg]=useState('');

  useEffect(()=>{
    fetch('/api/settings/ai').then(r=>r.json()).then(d=>{
      setSettings(d);
      setProvider(d.provider||'groq');
      setModel(d.model||'');
      if(d.api_key_set) setApiKey('');  // don't show existing key
    });
  },[]);

  const models = provider==='groq'
    ? (settings?.groq_models||[])
    : (settings?.gemini_models||[]);

  const save=async()=>{
    setSaving(true);setMsg('');
    const body={provider};
    if(apiKey.trim()) body.api_key=apiKey.trim();
    if(model) body.model=model;
    const r=await fetch('/api/settings/ai',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    setSaving(false);
    if(r.ok){const d2=await r.json();setMsg('Saved!');setApiKey('');fetch('/api/settings/ai').then(r2=>r2.json()).then(d=>{setSettings(d);});if(onConfigured)onConfigured(!!(d2.is_configured));}
    else{const d=await r.json();setMsg('Error: '+(d.detail||'unknown'));}
  };

  const removeKey=async()=>{
    if(!confirm('Remove the saved API key? AI features will be disabled until a new key is added.'))return;
    setSaving(true);
    const r=await fetch('/api/settings/ai',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({provider,api_key:''})});
    setSaving(false);
    if(r.ok){setMsg('Key removed');setSettings(s=>({...s,api_key_set:false,api_key_preview:''}));setApiKey('');if(onConfigured)onConfigured(false);}
    else setMsg('Error removing key');
  };

  const test=async()=>{
    setTesting(true);setTestResult(null);
    // Save first if key is entered
    if(apiKey.trim()){
      const body={provider};if(apiKey.trim())body.api_key=apiKey.trim();if(model)body.model=model;
      await fetch('/api/settings/ai',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    }
    const r=await fetch('/api/settings/ai/test',{method:'POST'});
    const d=await r.json();
    setTesting(false);
    setTestResult(d);
  };

  const freeNote = provider==='groq'
    ? (<>Get a free API key at <a href="https://console.groq.com" target="_blank" rel="noreferrer">console.groq.com</a> — no credit card needed. Free tier: 30 req/min, 14,400 req/day.</>)
    : (<>Get a free API key at <a href="https://aistudio.google.com/app/apikey" target="_blank" rel="noreferrer">aistudio.google.com</a> — free for personal use. Flash model: 15 req/min, 1M tokens/day.</>);

  return(
    <div className="ai-settings-modal" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="ai-settings-card">
        <div className="ai-settings-hdr">
          <div className="ai-settings-title">⚡ AI Settings</div>
          <button className="btn btn-ghost" onClick={onClose} style={{padding:'4px 10px'}}>✕</button>
        </div>

        <div style={{fontSize:'.72rem',color:'var(--txt2)',marginBottom:1.1+'rem',lineHeight:1.6}}>
          JobBot uses AI for cover letters, job matching, skill gap analysis, and interview prep. Choose your provider — both are free.
        </div>

        <div style={{fontSize:'.62rem',fontWeight:700,letterSpacing:'1.2px',textTransform:'uppercase',color:'var(--txt3)',marginBottom:'.5rem'}}>Provider</div>
        <div className="ai-prov-btns">
          <button className={'ai-prov-btn'+(provider==='groq'?' active':'')} onClick={()=>{setProvider('groq');setModel('');}}>
            <span className="ai-prov-icon">⚡</span>
            <span style={{fontWeight:700}}>Groq</span>
            <span style={{fontSize:'.65rem',color:'var(--grn)'}}>Ultra-fast · Free</span>
          </button>
          <button className={'ai-prov-btn'+(provider==='gemini'?' active':'')} onClick={()=>{setProvider('gemini');setModel('');}}>
            <span className="ai-prov-icon">✦</span>
            <span style={{fontWeight:700}}>Gemini</span>
            <span style={{fontSize:'.65rem',color:'var(--pur2)'}}>Google · Free</span>
          </button>
        </div>

        <div className="ai-free-note">{freeNote}</div>

        <div style={{fontSize:'.62rem',fontWeight:700,letterSpacing:'1.2px',textTransform:'uppercase',color:'var(--txt3)',marginBottom:'.4rem'}}>API Key</div>
        <div className="ai-key-wrap">
          <input
            className="ai-key-input"
            type={showKey?'text':'password'}
            placeholder={settings?.api_key_set ? '••••••••••• (key saved — enter new key to change)' : `Paste your ${provider==='groq'?'Groq':'Gemini'} API key here`}
            value={apiKey}
            onChange={e=>setApiKey(e.target.value)}
          />
          <button className="ai-key-eye" onClick={()=>setShowKey(s=>!s)}>{showKey?'🙈':'👁'}</button>
        </div>
        {settings?.api_key_set&&<div style={{fontSize:'.68rem',color:'var(--grn)',marginBottom:'.7rem'}}>✓ Key saved: {settings.api_key_preview}</div>}

        <div style={{fontSize:'.62rem',fontWeight:700,letterSpacing:'1.2px',textTransform:'uppercase',color:'var(--txt3)',marginBottom:'.4rem'}}>Model</div>
        <select className="ai-model-sel" value={model} onChange={e=>setModel(e.target.value)}>
          <option value="">Default (recommended)</option>
          {models.map(m=><option key={m.id} value={m.id}>{m.label} — {m.context} context</option>)}
        </select>

        <div className="ai-test-row">
          <button className="btn" onClick={test} disabled={testing||(!settings?.api_key_set&&!apiKey.trim())} style={{fontSize:'.75rem',padding:'6px 14px'}}>
            {testing?'Testing…':'Test connection'}
          </button>
          {testResult&&<span className={'ai-test-result'+(testResult.ok?'':' err')}>
            {testResult.ok?`✓ Connected — ${testResult.provider} / ${testResult.model}`:('✗ '+testResult.error)}
          </span>}
        </div>

        {msg&&<div style={{fontSize:'.73rem',color:msg.startsWith('Error')?'var(--red)':'var(--grn)',marginBottom:'.6rem'}}>{msg}</div>}
        <div style={{display:'flex',gap:8,alignItems:'center'}}>
          <button className="ai-save-btn" onClick={save} disabled={saving} style={{flex:1}}>{saving?'Saving…':'Save Settings'}</button>
          {settings?.api_key_set&&<button onClick={removeKey} disabled={saving} style={{padding:'9px 14px',background:'none',border:'1px solid var(--red)',color:'var(--red)',borderRadius:9,fontSize:'.75rem',fontWeight:600,cursor:'pointer',whiteSpace:'nowrap',transition:'background .15s'}} onMouseEnter={e=>e.target.style.background='rgba(239,68,68,.1)'} onMouseLeave={e=>e.target.style.background='none'}>Remove Key</button>}
        </div>
      </div>
    </div>
  );
}


function AIPanel({job,aiActive=false}){
  const [tab,setTab]=useState('score');
  const [data,setData]=useState({score:null,gap:null,prep:null,cl:null});
  const [loading,setLoading]=useState({score:false,gap:false,prep:false,cl:false});
  const [errors,setErrors]=useState({});
  const [editedCL,setEditedCL]=useState('');

  const fetch_ai=async(endpoint,key)=>{
    if(loading[key])return;
    setLoading(p=>({...p,[key]:true}));
    setErrors(p=>({...p,[key]:null}));
    try{
      const r=await fetch('/api/jobs/'+job.id+'/'+endpoint,{method:'POST'});
      const d=await r.json();
      if(!r.ok)throw new Error(d.detail||'AI request failed');
      setData(p=>({...p,[key]:d}));
      if(key==='cl') setEditedCL(d.cover_letter||'');
    }catch(e){setErrors(p=>({...p,[key]:e.message}));}
    setLoading(p=>({...p,[key]:false}));
  };

  useEffect(()=>{
    // Auto-load score on mount
    if(!data.score&&!loading.score) fetch_ai('match-score','score');
    // Pre-populate cover letter if already exists
    if(job.cover_letter&&!editedCL) setEditedCL(job.cover_letter);
  },[job.id]);

  const scoreNum=data.score?.score;
  const scoreCls=scoreNum>=75?'strong':scoreNum>=55?'good':scoreNum>=35?'partial':'weak';

  if(!aiActive) return(
    <div className="ai-panel" style={{marginTop:'1.5rem'}}>
      <div className="ai-panel-hdr">⚡ AI Analysis</div>
      <div className="ai-locked">
        <div className="ai-locked-ico">🔒</div>
        <div className="ai-locked-title">AI features not configured</div>
        <div className="ai-locked-sub">Add a free Groq or Gemini API key to unlock match scoring, skill gap analysis, interview prep, and AI-generated cover letters.</div>
        <button className="ai-locked-btn" onClick={()=>document.querySelector('.ai-nav-btn')?.click()}>Configure AI ⚡</button>
      </div>
    </div>
  );

  return(
    <div className="ai-panel">
      <div className="ai-panel-hdr">
        <span className="ai-panel-title">✦ AI Analysis</span>
        {tab==='score'&&data.score&&<span style={{fontSize:'.68rem',color:'var(--txt3)',fontFamily:'var(--mono)'}}>cached</span>}
      </div>
      <div className="ai-panel-tabs">
        {[['score','Match Score'],['gap','Skill Gap'],['prep','Interview Prep'],['cl','Cover Letter']].map(([k,l])=>(
          <button key={k} className={'ai-tab'+(tab===k?' active':'')} onClick={()=>{setTab(k);if(k!=='score'&&k!=='cl'&&!data[k])fetch_ai(k==='gap'?'skill-gap':'interview-prep',k);}}>
            {l}{k==='score'&&data.score?.score!=null&&<span style={{marginLeft:4,fontSize:'.6rem',fontFamily:'var(--mono)'}}>{data.score.score}</span>}
          </button>
        ))}
      </div>
      <div className="ai-panel-body">

        {/* ── Match Score ── */}
        {tab==='score'&&(
          loading.score
            ?<div className="ai-loading"><div className="ai-spinner"/><span>Analysing job fit…</span></div>
            :errors.score
              ?<><div className="ai-error">{errors.score}</div><button className="ai-gen-btn" onClick={()=>fetch_ai('match-score','score')}>Retry</button></>
              :data.score?(
                <>
                  <div className="ai-score-big">
                    <div className={'ai-score-num '+scoreCls}>{data.score.score}</div>
                    <div>
                      <div className="ai-verdict">{data.score.verdict}</div>
                      <div className="ai-recommendation">{data.score.recommendation}</div>
                    </div>
                  </div>
                  {data.score.strengths?.length>0&&<div style={{marginBottom:'.6rem'}}><div className="ai-skill-group">Strengths</div><div className="ai-skill-tags">{data.score.strengths.map((s,i)=><span key={i} className="ai-skill-tag" style={{background:'rgba(34,197,94,.07)',color:'#4ade80',border:'1px solid rgba(34,197,94,.18)',padding:'3px 9px',borderRadius:6,fontSize:'.71rem'}}>{s}</span>)}</div></div>}
                  <div className="ai-skill-lists">
                    <div><div className="ai-skill-group">✓ You have</div><div className="ai-skill-tags">{(data.score.matched_skills||[]).map(s=><span key={s} className="ai-skill-tag ai-skill-has">{s}</span>)}</div></div>
                    <div><div className="ai-skill-group">⚠ Missing</div><div className="ai-skill-tags">{(data.score.missing_skills||[]).map(s=><span key={s} className="ai-skill-tag ai-skill-miss">{s}</span>)}</div></div>
                  </div>
                  <button className="ai-gen-btn" style={{marginTop:'1rem',fontSize:'.7rem',padding:'4px 12px',background:'var(--surf)',color:'var(--txt3)',border:'1px solid var(--bdr)'}} onClick={()=>{setData(p=>({...p,score:null}));fetch_ai('match-score','score');}}>↻ Refresh</button>
                </>
              ):<div className="ai-loading"><div className="ai-spinner"/></div>
        )}

        {/* ── Skill Gap ── */}
        {tab==='gap'&&(
          loading.gap
            ?<div className="ai-loading"><div className="ai-spinner"/><span>Analysing skill gaps…</span></div>
            :errors.gap
              ?<><div className="ai-error">{errors.gap}</div><button className="ai-gen-btn" onClick={()=>fetch_ai('skill-gap','gap')}>Retry</button></>
              :!data.gap?<div className="ai-loading"><div className="ai-spinner"/></div>
              :(
                <>
                  <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:'1rem'}}>
                    <div style={{flex:1}}>
                      <div style={{fontSize:'.72rem',color:'var(--txt3)',marginBottom:4}}>Readiness</div>
                      <div className="ai-readiness-bar"><div className="ai-readiness-fill" style={{width:data.gap.overall_readiness||'0%'}}/></div>
                      <div style={{fontSize:'.8rem',fontWeight:700,color:'var(--pur2)'}}>{data.gap.overall_readiness}</div>
                    </div>
                  </div>
                  <div style={{fontSize:'.76rem',color:'var(--txt2)',lineHeight:1.65,marginBottom:'1rem'}}>{data.gap.summary}</div>
                  <div className="ai-skill-lists" style={{marginBottom:'1rem'}}>
                    <div><div className="ai-skill-group">✓ You have</div><div className="ai-skill-tags">{(data.gap.candidate_has||[]).map(s=><span key={s} className="ai-skill-tag ai-skill-has">{s}</span>)}</div></div>
                    <div><div className="ai-skill-group">⚠ Missing</div><div className="ai-skill-tags">{(data.gap.candidate_missing||[]).map(s=><span key={s} className="ai-skill-tag ai-skill-miss">{s}</span>)}{(data.gap.nice_to_have||[]).map(s=><span key={s} className="ai-skill-tag ai-skill-nice">{s}</span>)}</div></div>
                  </div>
                  {data.gap.learning_path?.length>0&&<>
                    <div className="ai-skill-group" style={{marginBottom:'.5rem'}}>Learning Path</div>
                    {data.gap.learning_path.map((item,i)=>(
                      <div key={i} className="ai-learn-item">
                        <div className="ai-learn-skill">{item.skill}</div>
                        <div className="ai-learn-meta">
                          <span className={'ai-priority '+(item.priority||'medium')}>{item.priority||'medium'}</span>
                          <span className="ai-learn-time">⏱ {item.time_estimate}</span>
                        </div>
                        <div className="ai-learn-resource">📚 {item.resource}</div>
                      </div>
                    ))}
                  </>}
                </>
              )
        )}

        {/* ── Interview Prep ── */}
        {tab==='prep'&&(
          loading.prep
            ?<div className="ai-loading"><div className="ai-spinner"/><span>Generating interview questions…</span></div>
            :errors.prep
              ?<><div className="ai-error">{errors.prep}</div><button className="ai-gen-btn" onClick={()=>fetch_ai('interview-prep','prep')}>Retry</button></>
              :!data.prep?<div className="ai-loading"><div className="ai-spinner"/></div>
              :(
                <>
                  {[
                    {key:'behavioral_questions',label:'Behavioral Questions'},
                    {key:'technical_questions',label:'Technical Questions'},
                    {key:'role_specific_questions',label:'Role-Specific Questions'},
                  ].map(section=>(
                    <div key={section.key} className="ai-q-section">
                      <div className="ai-q-section-title">{section.label}</div>
                      {(data.prep[section.key]||[]).map((q,i)=>(
                        <div key={i} className="ai-q-item">
                          <div className="ai-q-text">Q: {q.question}</div>
                          {(q.tip||q.hint)&&<div className="ai-q-hint">→ {q.tip||q.hint}</div>}
                        </div>
                      ))}
                    </div>
                  ))}
                  {data.prep.questions_to_ask?.length>0&&(
                    <div className="ai-q-section">
                      <div className="ai-q-section-title">Questions to Ask Interviewer</div>
                      {data.prep.questions_to_ask.map((q,i)=><div key={i} className="ai-q-item"><div className="ai-q-text">{q}</div></div>)}
                    </div>
                  )}
                  {data.prep.prep_tips?.length>0&&(
                    <div className="ai-q-section">
                      <div className="ai-q-section-title">Prep Tips</div>
                      {data.prep.prep_tips.map((t,i)=><div key={i} className="ai-q-item"><div className="ai-q-text">{t}</div></div>)}
                    </div>
                  )}
                </>
              )
        )}

        {/* ── Cover Letter ── */}
        {tab==='cl'&&(
          <>
            {errors.cl&&<div className="ai-error">{errors.cl}</div>}
            <textarea
              className="ai-cl-area"
              value={editedCL}
              onChange={e=>setEditedCL(e.target.value)}
              placeholder="No cover letter yet — click Generate below"
            />
            <div style={{display:'flex',gap:8,marginTop:'.6rem',flexWrap:'wrap'}}>
              <button className="ai-gen-btn" onClick={()=>fetch_ai('cover-letter','cl')} disabled={loading.cl}>
                {loading.cl?'Generating…':(editedCL?'↻ Regenerate':'✦ Generate Cover Letter')}
              </button>
              {editedCL&&<button className="btn" style={{fontSize:'.75rem',padding:'6px 14px'}} onClick={()=>{navigator.clipboard.writeText(editedCL);toast('Copied!');}}>📋 Copy</button>}
            </div>
          </>
        )}

      </div>
    </div>
  );
}


function ConfigPanel({onClose}){
  const [cfg,setCfg]=useState(null);
  const [kwInput,setKwInput]=useState('');
  const [locInput,setLocInput]=useState('');
  const [saving,setSaving]=useState(false);

  useEffect(()=>{
    fetch('/api/config').then(r=>r.json()).then(setCfg);
  },[]);

  const save=async(patch)=>{
    setSaving(true);
    await fetch('/api/config',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(patch)});
    setSaving(false);
  };

  const addKw=async()=>{
    if(!kwInput.trim())return;
    const next=[...(cfg.keywords||[]),kwInput.trim().toLowerCase()];
    setCfg(p=>({...p,keywords:next}));
    setKwInput('');
    await save({keywords:next});
  };

  const removeKw=async(kw)=>{
    const next=(cfg.keywords||[]).filter(k=>k!==kw);
    setCfg(p=>({...p,keywords:next}));
    await save({keywords:next});
  };

  const addLoc=async()=>{
    if(!locInput.trim())return;
    const next=[...(cfg.locations||[]),locInput.trim()];
    setCfg(p=>({...p,locations:next}));
    setLocInput('');
    await save({locations:next});
  };

  const removeLoc=async(loc)=>{
    const next=(cfg.locations||[]).filter(l=>l!==loc);
    setCfg(p=>({...p,locations:next}));

  };

  const togglePortal=async(key)=>{
    const cur=cfg.portals||{};
    const isOn=(cur[key]?.enabled!==false);

    await save({portals:next});
  };

  if(!cfg)return <div className="cfg-modal"><div className="cfg-card" style={{display:'flex',alignItems:'center',justifyContent:'center',minHeight:200}}><div className="spin" style={{width:24,height:24,border:'2.5px solid var(--bdr2)',borderTopColor:'var(--accent)',display:'inline-block'}}/></div></div>;

  return(
    <div className="cfg-modal" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="cfg-card">
        <div className="cfg-hdr">
          <div className="cfg-title">⚙ Scan Settings</div>
          <button className="btn btn-ghost" onClick={onClose} style={{padding:'4px 10px'}}>✕</button>

        <div className="cfg-sec">
          <div className="cfg-sec-title">Search keywords {saving&&<span style={{color:'var(--accent)'}}>saving...</span>}</div>
          <div style={{fontSize:'.7rem',color:'var(--txt3)',marginBottom:'.5rem'}}>JobBot searches for jobs matching any of these titles across all enabled portals.</div>
          <div className="cfg-tag-wrap">
            {(cfg.keywords||[]).map(k=>(
              <span key={k} className="cfg-tag">{k}<span className="rm" onClick={()=>removeKw(k)}>✕</span></span>
            ))}
          </div>
          <div className="cfg-add-row">
            <input value={kwInput} onChange={e=>setKwInput(e.target.value)} onKeyDown={e=>e.key==='Enter'&&addKw()} placeholder="e.g. react developer, devops engineer..."/>
            <button onClick={addKw}>+ Add</button>
          </div>
        </div>

        <div className="cfg-sec">
          <div className="cfg-sec-title">Locations</div>
          <div className="cfg-tag-wrap">
            {(cfg.locations||[]).map(l=>(
              <span key={l} className="cfg-tag">{l}<span className="rm" onClick={()=>removeLoc(l)}>✕</span></span>
            ))}
          </div>
          <div className="cfg-add-row">
            <input value={locInput} onChange={e=>setLocInput(e.target.value)} onKeyDown={e=>e.key==='Enter'&&addLoc()} placeholder="e.g. Pune, Chennai, Remote..."/>
            <button onClick={addLoc}>+ Add</button>
          </div>
        </div>

        <div className="cfg-sec">
          <div className="cfg-sec-title">Portals</div>
          <div style={{fontSize:'.7rem',color:'var(--txt3)',marginBottom:'.65rem'}}>Toggle which portals to search. Disabled portals are skipped entirely.</div>
          <div className="portal-grid">
            {KNOWN_PORTALS.map(p=>{
              const enabled=(cfg.portals?.[p.key]?.enabled!==false);
              return(
                <div key={p.key} className="portal-row">
                  <div>
                    <div className="portal-name">{p.label}</div>
                    <div className="portal-badge">{p.desc}</div>
                  </div>
                  <button className={'toggle '+(enabled?'on':'off')} onClick={()=>togglePortal(p.key)}/>
                </div>
              );
            })}
          </div>
        </div>
      </div>
    </div>
  );
}
