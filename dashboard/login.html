<!DOCTYPE html>
<html lang="en" id="login-html">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JobBot — Sign In</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#f5f5f5;color:#1c150a;font-family:'Inter',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1rem;}
.card{background:#fff;border:1px solid rgba(0,0,0,.12);border-radius:20px;padding:2.5rem;width:100%;max-width:400px;box-shadow:0 8px 32px rgba(0,0,0,.06);}
.back{display:inline-block;font-size:.78rem;color:rgba(0,0,0,.4);text-decoration:none;margin-bottom:1.5rem;transition:color .15s;}
.back:hover{color:#c9922a;}
.logo{font-family:'Syne',sans-serif;font-size:1.8rem;font-weight:800;letter-spacing:-1px;margin-bottom:.25rem;color:#1c150a;}
.logo span{color:#c9922a;}
.sub{font-size:.82rem;color:rgba(0,0,0,.45);margin-bottom:2rem;}
label{display:block;font-size:.72rem;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:rgba(0,0,0,.4);margin-bottom:.45rem;}
input{width:100%;background:#f5f5f5;border:1.5px solid #e5e5e5;color:#1c150a;font-family:'Inter',sans-serif;font-size:.9rem;padding:.72rem 1rem;border-radius:10px;outline:none;transition:border-color .15s,background .15s;margin-bottom:1.2rem;}
input:focus{border-color:rgba(201,146,42,.6);background:#fff;}
input::placeholder{color:#bbb;}
.pw-wrap{position:relative;margin-bottom:1.2rem;}
.pw-wrap input{margin-bottom:0;padding-right:2.8rem;}
#toggle-pass{position:absolute;right:.8rem;top:50%;transform:translateY(-50%);cursor:pointer;color:rgba(0,0,0,.3);font-size:.9rem;transition:color .15s;}
#toggle-pass:hover{color:#c9922a;}
button{width:100%;padding:.85rem;background:#c9922a;border:none;border-radius:10px;color:#fff;font-family:'Inter',sans-serif;font-size:.95rem;font-weight:600;cursor:pointer;transition:background .15s,transform .1s;margin-top:.25rem;}
button:hover{background:#9a6e22;transform:translateY(-1px);}
button:disabled{opacity:.7;transform:none;}
.err{color:#dc2626;font-size:.75rem;margin-top:.75rem;text-align:center;min-height:1.2rem;}
.hint{font-size:.68rem;color:rgba(0,0,0,.3);text-align:center;margin-top:1.5rem;}
.signup-link{text-align:center;margin-top:1rem;font-size:.8rem;color:rgba(0,0,0,.45);}
.signup-link a{color:#c9922a;text-decoration:none;font-weight:600;}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-right:8px;}
@keyframes spin{to{transform:rotate(360deg)}}

[data-theme="dark"] body{background:#0a0a0a;color:#f5f5f7;}
[data-theme="dark"] .card{background:#161616;border-color:rgba(255,255,255,.1);box-shadow:0 8px 32px rgba(0,0,0,.4);}
[data-theme="dark"] .logo{color:#f5f5f7;}
[data-theme="dark"] .sub{color:rgba(245,245,247,.45);}
[data-theme="dark"] label{color:rgba(245,245,247,.4);}
[data-theme="dark"] input{background:#111111;border-color:rgba(255,255,255,.12);color:#f5f5f7;}
[data-theme="dark"] input:focus{border-color:rgba(201,146,42,.6);background:#111111;}
[data-theme="dark"] input::placeholder{color:rgba(255,255,255,.25);}
[data-theme="dark"] .back{color:rgba(245,245,247,.35);}
[data-theme="dark"] .hint{color:rgba(245,245,247,.25);}
[data-theme="dark"] .signup-link{color:rgba(245,245,247,.4);}
[data-theme="dark"] #toggle-pass{color:rgba(245,245,247,.3);}

[data-ai="active"][data-theme="dark"] input:focus{border-color:rgba(201,146,42,.7);}
[data-ai="active"] button[type="submit"]{background:#c9922a;}
[data-ai="active"] button[type="submit"]:hover{background:#9a6e22;}
[data-ai="active"] .back:hover,[data-ai="active"] .signup-link a,[data-ai="active"] #toggle-pass:hover{color:#c9922a;}
</style>
</head>
<body>
<div class="card">
  <a href="/" class="back">← Back to home</a>
  <div class="logo">Job<span>Bot</span></div>
  <div class="sub">Automated job discovery pipeline</div>
  <form id="form">
    <label>Username</label>
    <input id="user" type="text" placeholder="admin" autocomplete="username" required/>
    <label>Password</label>
    <div class="pw-wrap">
      <input id="pass" type="password" placeholder="••••••••" autocomplete="current-password" required style="margin-bottom:0;padding-right:2.8rem;"/>
      <span id="toggle-pass" onclick="togglePass()" title="Show password">👁</span>
    </div>
    <button type="submit" id="btn">Sign In</button>
    <div class="err" id="err"></div>
  </form>
  <div class="hint">Secured with bcrypt + JWT · httpOnly cookies · Local only</div>
  <div class="signup-link">No account? <a href="/signup">Sign up</a></div>
</div>
<script>

// Theme & AI sync
(function(){
  var t=localStorage.getItem('jb-theme')||'light';
  document.getElementById('login-html').setAttribute('data-theme',t);
  if(localStorage.getItem('jb-ai')==='1') document.getElementById('login-html').setAttribute('data-ai','active');
})();
// If already logged in, skip to dashboard
fetch('/auth/me').then(r=>{if(r.ok)window.location.replace('/dashboard');}).catch(()=>{});

document.getElementById('form').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = document.getElementById('btn');
  const err = document.getElementById('err');
  btn.innerHTML = '<span class="spinner"></span>Signing in...'; btn.disabled = true; err.textContent = '';
  try {
    const r = await fetch('/auth/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({username: document.getElementById('user').value, password: document.getElementById('pass').value})
    });
    const d = await r.json();
    if (r.ok) { window.location.replace('/dashboard'); }
    else { err.textContent = d.detail || 'Invalid credentials'; }
  } catch(e) { err.textContent = 'Connection error'; }
  btn.innerHTML = 'Sign In'; btn.disabled = false;
});

function togglePass(){
  const inp = document.getElementById('pass');
  const icon = document.getElementById('toggle-pass');
  if(inp.type === 'password'){
    inp.type = 'text';
    icon.textContent = '🙈';
    icon.style.color = 'rgba(201,146,42,.9)';
  } else {
    inp.type = 'password';
    icon.textContent = '👁';
    icon.style.color = 'rgba(245,245,247,.4)';
  }
}
</script>
</body>
</html>
